<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 아이 어휘 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  /* 카테고리 → 사물 → 숫자 1·2·3·4 단계 + 퀴즈. 하늘색 바탕에 노란 버튼, 탈것 놀이터 느낌 */
  --bg:#e6f1fb;
  --paper:#fffefa;
  --ink:#24323f;
  --muted:#5e6d7a;
  --accent:#2f7fc1;
  --sun:#ffc63d;
  --good:#2e9e62;
  --line:#d3e0ec;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 40px}
button{font:inherit;color:inherit}
.btn{font-family:var(--display);font-size:clamp(18px,3.8vw,22px);border:none;border-radius:999px;padding:12px 22px;cursor:pointer;background:#e4ebf2;color:var(--ink);min-height:52px}
.btn:focus-visible,.card:focus-visible,.num:focus-visible,.qt:focus-visible,.pick:focus-visible,.listen:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.btn-next{background:var(--accent);color:#fff;min-width:130px}
.btn-next:disabled{background:#cfd8df;color:#738088;cursor:not-allowed}
.btn-sun{background:var(--sun);color:#3d2c00}
.btn.mini{font-size:16px;padding:8px 14px;min-height:44px}
.btn.big{font-size:clamp(22px,4.6vw,28px);padding:16px 30px}
.pulse{animation:pulse 1.2s ease-in-out infinite}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:19px;background:#fff;border-radius:999px;padding:10px 16px;text-decoration:none;color:var(--ink);box-shadow:0 3px 0 var(--line);border:none;cursor:pointer;min-height:48px}
.panel{background:var(--paper);border-radius:26px;box-shadow:0 8px 26px rgba(30,60,90,.12);overflow:hidden}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,40px);margin:0;text-wrap:balance}
h2.zone{font-family:var(--display);font-weight:400;font-size:clamp(20px,4vw,26px);margin:10px 20px 8px}
.say{font-family:var(--display);font-size:clamp(22px,4.8vw,30px);line-height:1.5;margin:0;word-break:keep-all}
.say .big{font-size:1.25em;color:#b35c00}
.hiddenTxt{color:var(--muted)}
.small{font-size:16px;color:var(--muted);line-height:1.6}
.chip{display:inline-block;font-family:var(--display);font-size:16px;background:#fff0c2;color:#6b4c00;border-radius:999px;padding:3px 12px;margin-bottom:8px}
.qtext{padding:18px 22px 8px}
.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px 18px;flex-wrap:wrap}
.note{margin:0 18px 10px;font-size:15px;color:#6e4e00;background:#fff3cf;border-radius:12px;padding:8px 12px;line-height:1.6}
.feedback{margin:0 18px 8px;padding:12px 16px;border-radius:16px;font-family:var(--display);font-size:clamp(18px,4vw,23px);line-height:1.45;word-break:keep-all}
.fb-good{background:#e5f6ec;color:#1b6640}
.fb-hint{background:#fff3cf;color:#6e4e00}

/* 첫 화면 */
.hero{display:flex;align-items:center;gap:16px;padding:18px 22px}
.avatar{width:96px;height:96px;flex:none}
.count{font-family:var(--display);font-size:19px;color:#7a5a00;background:#fff3c4;border-radius:999px;padding:4px 14px;display:inline-block;margin-top:6px}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:6px 18px 20px}
.cat{border:4px solid var(--line);background:#fff;border-radius:26px;padding:18px 10px;min-height:170px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-size:clamp(20px,4.2vw,26px)}
.cat .ic{font-size:clamp(52px,10vw,72px);line-height:1}
.cat .cnt{font-size:16px;color:#7a5a00;background:#fff3c4;border-radius:999px;padding:2px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;padding:4px 18px 20px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border:4px solid var(--line);border-radius:24px;padding:12px 8px 14px;cursor:pointer}
.card img{width:130px;height:130px;border-radius:20px;object-fit:cover}
.card .ph{width:130px;height:130px;border-radius:20px;border:3px dashed #b9c7d4;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;color:var(--muted);padding:8px}
.card .nm{font-family:var(--display);font-size:22px}
.card.got{border-color:#f2c94c;background:#fffaea}
.badge{position:absolute;top:6px;right:8px;font-size:30px}

/* 사물 학습 */
.hubhead{display:flex;gap:14px;align-items:center;padding:18px 20px 6px}
.hubhead img{width:90px;height:90px;border-radius:20px;object-fit:cover;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.parts{display:flex;gap:10px;flex-wrap:wrap;padding:6px 20px}
.partbtn{font-family:var(--display);font-size:19px;border:3px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;min-height:48px;cursor:pointer}
.partbtn.on{border-color:var(--accent);background:#e3f0fb}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:12px 18px 6px}
.num{position:relative;border:4px solid var(--line);background:#fff;border-radius:24px;padding:12px 6px;min-height:150px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--display)}
.num .n{font-size:clamp(44px,9vw,64px);line-height:1;color:var(--accent)}
.num .ic{font-size:28px}.num .t{font-size:clamp(15px,3.2vw,20px);word-break:keep-all;text-align:center}
.num.done{border-color:#f2c94c;background:#fffaea}
.num .st{position:absolute;top:6px;right:10px;font-size:22px}
.num:disabled{opacity:.45;cursor:not-allowed}
.qtypes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 18px 20px}
.qt{border:3px solid var(--line);background:#fff;border-radius:18px;padding:12px 6px;min-height:96px;cursor:pointer;font-family:var(--display);font-size:clamp(15px,3.2vw,19px);display:flex;flex-direction:column;align-items:center;gap:4px;word-break:keep-all;text-align:center}
.qt .ic{font-size:30px}.qt.done{border-color:#f2c94c;background:#fffaea}
.qt:disabled{opacity:.45;cursor:not-allowed}
.photowrap{margin:6px 18px 8px;border-radius:20px;overflow:hidden;background:#e9eef3;display:flex;justify-content:center}
.wsvg{display:block;width:100%;height:auto;max-height:58vh;touch-action:manipulation}
.photowrap.small .wsvg{max-height:34vh}
.plabel{font-family:var(--display);fill:#fff;stroke:#24323f;stroke-width:5px;paint-order:stroke}
.glow{animation:glow 1.2s ease-in-out infinite}
.missing{margin:12px 18px;padding:18px;border:3px dashed #b9c7d4;border-radius:18px;text-align:center;color:var(--muted);font-size:17px;line-height:1.6}
.missing code{background:#eef3f8;border-radius:6px;padding:2px 6px}

/* 퀴즈 보기 */
.bopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;padding:6px 18px 14px}
.bopt{display:flex;flex-direction:column;gap:6px;border:4px solid var(--line);background:#fff;border-radius:22px;padding:8px}
.bopt.right{border-color:var(--good);background:#e5f6ec}
.bopt.tried{background:#f3f5f7}
.bopt .pick{border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:110px;justify-content:center;font-family:var(--display);color:var(--ink)}
.bopt .pick .n{font-size:clamp(40px,8vw,56px);line-height:1;color:var(--accent)}
.bopt .pick .w{font-size:clamp(18px,4vw,24px);word-break:keep-all;text-align:center}
.bopt .listen{border:none;border-radius:999px;background:#fff3c4;font-family:var(--display);font-size:16px;padding:8px;cursor:pointer;min-height:44px}
.saybtns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:0 18px 20px}

/* 칭찬 */
.star{position:fixed;font-size:30px;color:var(--sun);pointer-events:none;text-shadow:0 1px 0 #d99a00;animation:pop 1.4s ease-out forwards;z-index:5}
.praise{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:20;background:#fff;border-radius:28px;padding:18px 28px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:14px;font-family:var(--display);font-size:clamp(24px,5vw,34px);animation:praise 2.2s ease-out forwards;pointer-events:none}
.praise .avatar{width:80px;height:80px;animation:hop .5s ease-in-out 3}
.sticker{position:relative;width:min(280px,66vw);aspect-ratio:1;margin:18px auto 6px;border-radius:50%;background:radial-gradient(circle,#fff7cf 0 60%,#ffd96b 61% 100%);display:grid;place-items:center;animation:spin-in .8s ease-out}
.sticker img{width:76%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:6px solid #fff}
.sticker .st{position:absolute;bottom:-6px;right:6px;font-size:60px}

/* 부모님 */
details.parent{margin-top:18px;background:var(--paper);border-radius:20px;padding:12px 18px;box-shadow:0 4px 14px rgba(30,60,90,.08)}
details.parent summary{font-family:var(--display);font-size:20px;cursor:pointer;min-height:40px}
.form{display:grid;gap:12px;margin:12px 0}
.field{display:grid;gap:6px;font-size:16px;color:var(--muted)}
.field input[type=text]{font-family:var(--display);font-size:22px;padding:8px 12px;border-radius:12px;border:3px solid var(--line);max-width:260px;color:var(--ink);background:#fff}
.check{display:flex;align-items:center;gap:10px;font-size:17px}
.check input{width:22px;height:22px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{font-family:var(--display);font-size:18px;border:3px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:#e3f0fb}
select{font-family:var(--body);font-size:17px;padding:8px 10px;border-radius:12px;border:3px solid var(--line);background:#fff;color:var(--ink);max-width:100%}
.testrow{display:flex;flex-wrap:wrap;gap:10px}
.vbox{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;color:var(--ink)}
.vs{margin:0;padding-left:18px;font-size:15px;line-height:1.7}
.diag{margin:8px 0 0;font-size:15px;line-height:1.6;background:#fff6d6;border-radius:10px;padding:8px 10px}
.vlog summary{cursor:pointer;font-size:14px;color:var(--muted);margin-top:6px}
.vlog pre{white-space:pre-wrap;font-size:12px;margin:6px 0 0;color:var(--muted)}
.soundfix{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:10;font-family:var(--display);font-size:22px;border:none;border-radius:999px;padding:14px 26px;background:#ff8f3d;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.soundfix[hidden]{display:none}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted)}
.tag{font-family:var(--display);font-size:14px;border-radius:999px;padding:3px 10px;white-space:nowrap}
.t1{background:#dff3e7;color:#1b6640}.t2{background:#fff0c7;color:#6e4e00}.t3{background:#fde0d8;color:#8a3a22}.t0{background:#eee;color:#888}

/* 터치 영역 만들기 (보호자용) */
.ed svg{touch-action:none;cursor:crosshair}
.ed .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:8px 18px}
.ed textarea{width:100%;min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace;border-radius:12px;border:2px solid var(--line);padding:8px}
.ed .targets{display:flex;gap:8px;flex-wrap:wrap;padding:6px 18px}
.ed .tbtn{font-family:var(--display);font-size:17px;border:3px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;min-height:44px}
.ed .tbtn.on{border-color:var(--accent);background:#e3f0fb}
.ed .tbtn.set::after{content:' ✔';color:var(--good)}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes glow{0%,100%{stroke-opacity:1}50%{stroke-opacity:.45}}
@keyframes pop{0%{transform:translateY(0) scale(.4);opacity:1}100%{transform:translateY(-110px) scale(1.2);opacity:0}}
@keyframes praise{0%{opacity:0;transform:translate(-50%,-40%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-55%) scale(1)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes spin-in{from{transform:rotate(-180deg) scale(.2)}to{transform:rotate(0) scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){.nums{grid-template-columns:1fr 1fr}.qtypes{grid-template-columns:1fr}.cats{grid-template-columns:1fr 1fr}.cat{min-height:140px}.grid{grid-template-columns:1fr 1fr}.card img,.card .ph{width:110px;height:110px}}
@media (orientation:landscape) and (min-width:900px){.wsvg{max-height:62vh}}
</style>
</head>

const KEY = 'wordExplorer.v1';
let store = {name:'토리', autoRead:true, nOpts:2, voiceURI:'', textMode:'voice', stickers:{}, prog:{}, quiz:{}, overrides:{}};
try{ const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) store = Object.assign(store, s); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

/* ---------- 글자 도우미 ---------- */
function hasBatchim(w){ const c=w.charCodeAt(w.length-1); if(c<0xAC00||c>0xD7A3) return false; return (c-0xAC00)%28!==0; }
function nm(){ const n = store.name || '토리'; return hasBatchim(n) ? n+'이' : n; }
function voc(){ const n = store.name || '토리'; if (hasBatchim(n)) return n+'아'; if (n.length>=2 && n.endsWith('이') && hasBatchim(n.slice(0,-1))) return n.slice(0,-1)+'아'; return n+'야'; }
function iy(w){ return hasBatchim(w) ? '이야' : '야'; }
function eun(w){ return w + (hasBatchim(w) ? '은' : '는'); }
function iga(w){ return w + (hasBatchim(w) ? '이' : '가'); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function today(){ return new Date().toISOString().slice(0,10); }

/* ---------- 읽어주기 (아이패드 Safari 대응) ----------
   원칙
   1) 말하기는 아이가 누른 그 순간(클릭 처리 안)에서 바로 speechSynthesis.speak()를 불러요.
   2) 아이패드에서는 앞 말이 실제로 남아 있을 때만 cancel()하고, 기다리는 타이머 없이 바로 말해요.
   3) 시작 신호(onstart)가 안 오면 한 번만 다시 시도하고, 그래도 안 되면 '소리 켜기' 버튼을 띄워요.
   4) 모든 시작·끝·오류 신호는 부모님 설정의 '음성 상태'에 기록돼요. */
const hasTTS = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const V = {
  voices: [], koVoices: [], chosen: null, bad: new Set(),
  gesture: false, silentUnlock: 'none',   // none | trying | ok | failed | skipped
  everStarted: false, last: null, log: [], diag: ''
};
let uttSeq = 0, currentUtt = null, startWatch = null;

function vlog(msg){
  const t = new Date().toTimeString().slice(0,8);
  V.log.unshift(`${t} ${msg}`); if (V.log.length > 14) V.log.length = 14;
  updateVoiceStatus();
}
function isKo(v){ return !!(v && v.lang && v.lang.toLowerCase().replace('_','-').startsWith('ko')); }
function rankVoice(v){
  const n = (v.name || '').toLowerCase(); let s = 0;
  if (v.lang.toLowerCase().replace('_','-') === 'ko-kr') s += 4;
  if (v.localService) s += 3;          // 기기에 설치된 목소리
  if (v.default) s += 2;
  if (/yuna|유나/.test(n)) s += 2;      // 아이패드 기본 한국어 목소리
  if (/enhanced|premium|고급|향상/.test(n)) s -= 3;   // 내려받지 않았으면 소리가 안 나는 경우가 있어 뒤로
  return s;
}
function loadVoices(){
  if (!hasTTS) return;
  try{
    V.voices = speechSynthesis.getVoices() || [];
    V.koVoices = V.voices.filter(isKo).sort((a,b) => rankVoice(b) - rankVoice(a));
    const want = store.voiceURI;
    V.chosen = (want && V.koVoices.find(v => v.voiceURI === want)) || V.koVoices[0] || null;
  }catch(e){ V.log.unshift('목소리 목록 오류: ' + e.message); }
  updateVoiceStatus();
}
if (hasTTS){
  loadVoices();
  try{ speechSynthesis.addEventListener('voiceschanged', loadVoices); }catch(e){}
  /* Safari는 목소리 목록을 늦게 주는 경우가 있어 몇 번 더 확인 (말하기와는 무관한 타이머) */
  [400, 1200, 3000].forEach(ms => setTimeout(() => { if (!V.koVoices.length) loadVoices(); }, ms));
}
function voiceFor(){
  const v = V.chosen;
  return (v && !V.bad.has(v.voiceURI)) ? v : null;
}
function makeUtt(text, opt){
  opt = opt || {};
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  const v = opt.noVoice ? null : voiceFor();
  if (v) u.voice = v;
  u.rate = 0.85; u.pitch = 1.1; u.volume = 1;
  const rec = {id: ++uttSeq, text, status:'요청함', error:'', voice: v ? v.name : '기본 한국어(ko-KR)', voiceURI: v ? v.voiceURI : '', tReq: Date.now(), tStart: 0};
  u.onstart = () => { rec.status = '재생 중'; rec.tStart = Date.now(); V.everStarted = true; hideSoundFix(); vlog(`▶ 시작 #${rec.id} (${rec.tStart - rec.tReq}ms, ${rec.voice})`); };
  u.onend = () => { rec.tEnd = Date.now(); if (rec.status !== '오류') rec.status = '끝남'; vlog(`■ 끝 #${rec.id} (재생 ${rec.tStart ? rec.tEnd - rec.tStart : 0}ms)`); };
  u.onerror = e => {
    const err = (e && e.error) || 'unknown';

    vlog(`✕ 오류 #${rec.id}: ${err}`);
    if (rec.voiceURI && /voice-unavailable|synthesis-failed|synthesis-unavailable|language-unavailable/.test(err)){
      V.bad.add(rec.voiceURI); vlog('이 목소리는 빼고 기본 한국어 목소리를 써요');

}
function startUtt(text, isRetry, opt){
  const u = makeUtt(text, opt);

  try{ speechSynthesis.resume(); }catch(e){}   // 멈춰 있는 대기열 깨우기
  speechSynthesis.speak(u);
  vlog(`요청 #${u._rec.id}${isRetry ? ' (다시 시도)' : ''}: ${text.slice(0,16)}${text.length > 16 ? '…' : ''}`);
  clearTimeout(startWatch);
  /* 시작 신호 확인용 타이머: 재생을 늦추지 않고, 신호가 안 올 때만 움직여요 */
  startWatch = setTimeout(() => {
    const r = u._rec;
    if (currentUtt !== u || r.status !== '요청함') return;
    if (!isRetry){
      vlog(`시작 신호 없음 #${r.id} → 기본 목소리로 한 번 더`);
      if (r.voiceURI) V.bad.add(r.voiceURI);
      try{ if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); }catch(e){}
      startUtt(text, true);
    } else {
      r.status = '시작 안 됨'; vlog(`시작 신호 없음 #${r.id} → '소리 켜기' 버튼 표시`);

    }

}
function speak(text, force){
  if (!hasTTS) return;
  if (!store.autoRead && !force) return;
  text = String(text).replace(/["“”]/g,'').replace(/\s+/g,' ').trim();
  if (!text) return;
  try{
    const busy = speechSynthesis.speaking || speechSynthesis.pending;
    if (isIOS){
      /* 아이패드: 같은 클릭 안에서 바로 말하기. 앞 말이 남아 있을 때만 멈춤 */
      if (busy){
        const r = currentUtt && currentUtt._rec;
        const stuck = r && (r.status === '끝남' || r.status === '오류' || r.status === '시작 안 됨');
        speechSynthesis.cancel();
        vlog(stuck ? '멈춘 대기열 정리' : '앞 말 멈춤');
      }
      startUtt(text);
    } else {
      /* 다른 기기: 기존 방식 유지 (말하는 중이면 멈추고 잠깐 뒤에 말하기) */
      if (busy){ speechSynthesis.cancel(); setTimeout(() => startUtt(text), 150); }
      else startUtt(text);
    }
  }catch(e){ vlog('말하기 오류: ' + e.message); }
}
function stopSpeech(){
  clearTimeout(startWatch);
  try{ if (hasTTS && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel(); }catch(e){}
}

/* 첫 터치: 음성 기능 깨우기 */
function onFirstGesture(){

}
/* 무음 활성화: 첫 클릭에서 진짜 말하기가 없었을 때만 시도. 실패해도 다음 진짜 말하기가 활성화를 대신해요 */
function trySilentUnlock(){
  if (!hasTTS || V.silentUnlock !== 'none') return;
  const r = currentUtt && currentUtt._rec;
  if (V.everStarted || speechSynthesis.speaking || speechSynthesis.pending || (r && r.status === '요청함')){
    V.silentUnlock = 'skipped'; updateVoiceStatus(); return;   // 이 클릭에서 이미 진짜 말하기를 시작함
  }
  V.silentUnlock = 'trying';
  let settled = false;
  const fail = why => {
    if (settled) return; settled = true; V.silentUnlock = 'failed';
    vlog(`무음 활성화 실패(${why}) → 다음 말하기로 활성화`);
    try{ if (!currentUtt && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel(); }catch(e){}
  };
  try{
    const u = new SpeechSynthesisUtterance(' ');
    u.lang = 'ko-KR'; u.volume = 0;
    const ok = () => { if (settled) return; settled = true; V.silentUnlock = 'ok'; vlog('무음 활성화 성공'); };
    u.onstart = ok; u.onend = ok;
    u.onerror = e => fail((e && e.error) || 'error');
    speechSynthesis.speak(u);
    setTimeout(() => fail('신호 없음'), 1500);
  }catch(e){ fail(e.message); }
}
document.addEventListener('touchend', onFirstGesture, {passive:true});
document.addEventListener('click', () => { onFirstGesture(); trySilentUnlock(); });   // 버튼 처리 뒤에 실행됨

/* 소리가 시작되지 않았을 때 보여주는 버튼: 새로 누르는 순간에 다시 말해요 */

/* 부모님 설정: 음성 상태 표시 */
function voiceStatusHTML(){

function updateVoiceStatus(){
  const el = document.getElementById('voiceStatus');
  if (el){ const lg = el.querySelector('.vlog'); const wasOpen = !!(lg && lg.open); el.innerHTML = voiceStatusHTML(); if (wasOpen){ const n = el.querySelector('.vlog'); if (n) n.open = true; } }

/* 추가 진단 1: 음성 말고 일반 소리(삐)가 나는지 — 무음 모드·볼륨 문제인지 가려내기 */
function beepTest(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ V.beep = '이 브라우저는 지원하지 않아요'; updateVoiceStatus(); return; }
    const ctx = window.__beepCtx || (window.__beepCtx = new AC());
    if (ctx.resume) ctx.resume();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 660; g.gain.value = 0.35;
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.6);
    V.beep = `재생 요청함 (오디오 상태: ${ctx.state}) — 들렸는지 확인해 주세요`;
    vlog('삐 소리 재생 요청 (' + ctx.state + ')');
  }catch(e){ V.beep = '오류: ' + e.message; vlog('삐 소리 오류: ' + e.message); }
}

      : `기본 목소리도 ${r.status}${r.error ? ' (' + esc(r.error) + ')' : ''}.`;

function soundTest(){

        : '✅ 말하기 시작 신호를 받았어요. 그래도 소리가 안 들리면 아래 \'삐 소리 테스트\'로 무음 모드·볼륨 문제인지 확인해 주세요.';
    else if (r.status === '오류')
      V.diag = `⚠️ 말하기 오류(${esc(r.error)})가 났어요. 위에서 다른 목소리를 골라 다시 테스트해 보세요.`;
    else

/* ---------- 상태 ---------- */
const app = document.getElementById('app');
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; } })();
let S = {screen:'home'};   // home | cat | hub | s1 | s2 | s3 | s4 | qa | qb | qc | sticker | edit

function textOn(){ return store.textMode === 'text' || S.reveal || !hasTTS; }

/* ---------- 사진: 있는지 확인하고 실제 크기를 읽어요 ---------- */
const PHOTO = {};   // id → {state:'loading'|'ok'|'missing', W, H}
function photoInfo(it){
  if (!PHOTO[it.id]){
    PHOTO[it.id] = {state:'loading'};
    const im = new Image();
    im.onload = () => { PHOTO[it.id] = {state:'ok', W: im.naturalWidth, H: im.naturalHeight}; photoChanged(); };
    im.onerror = () => { PHOTO[it.id] = {state:'missing'}; photoChanged(); };
    im.src = it.photo;
  }
  return PHOTO[it.id];
}
let photoTimer = null;
function photoChanged(){   // 사진 확인이 끝나면 지금 화면만 다시 그려요 (스크롤은 그대로)
  clearTimeout(photoTimer);
  photoTimer = setTimeout(() => {
    const f = {home:renderHome, cat:renderCat, hub:renderHub, edit:renderEdit}[S.screen];
    if (!f) return;
    const d = app.querySelector('details.parent'), open = d && d.open;
    f();
    const d2 = app.querySelector('details.parent'); if (open && d2) d2.open = true;
  }, 30);
}
/* 데이터 + 이 기기에서 그린 터치 영역(우선) */
function getShape(it, key){
  const ov = store.overrides[it.id] && store.overrides[it.id][key];
  if (ov && ov.shape) return ov.shape;
  const p = it.parts.find(x => x.id === key) || (it.others || []).find(x => x.id === key);
  return p ? p.shape : null;
}
function getZoom(it, key){
  const ov = store.overrides[it.id] && store.overrides[it.id][key];
  if (ov && ov.zoom) return ov.zoom;
  const p = it.parts.find(x => x.id === key);
  if (p && p.zoom) return p.zoom;
  const s = getShape(it, key); if (!s) return null;
  const b = bbox(s), cx = b.x + b.w/2, cy = b.y + b.h/2;   // 자동: 부분 주변을 넉넉히
  const w = Math.min(1, Math.max(b.w * 1.8, .25)), h = Math.min(1, Math.max(b.h * 1.8, .25));
  return {x: Math.min(Math.max(0, cx - w/2), 1 - w), y: Math.min(Math.max(0, cy - h/2), 1 - h), w, h};
}
function bbox(s){
  if (s.t === 'multi'){   // 여러 곳(예: 앞바퀴와 뒷바퀴)을 한 부분으로
    const bs = s.shapes.map(bbox), x = Math.min(...bs.map(b => b.x)), y = Math.min(...bs.map(b => b.y));
    return {x, y, w: Math.max(...bs.map(b => b.x + b.w)) - x, h: Math.max(...bs.map(b => b.y + b.h)) - y};
  }
  if (s.t === 'ellipse') return {x: s.cx - s.rx, y: s.cy - s.ry, w: s.rx*2, h: s.ry*2};
  return {x: s.x, y: s.y, w: s.w, h: s.h};
}
function shapeSVG(s, W, H, attrs){
  if (s.t === 'multi') return s.shapes.map(x => shapeSVG(x, W, H, attrs)).join('');
  if (s.t === 'ellipse') return `<ellipse cx="${s.cx*W}" cy="${s.cy*H}" rx="${s.rx*W}" ry="${s.ry*H}" ${attrs}/>`;
  return `<rect x="${s.x*W}" y="${s.y*H}" width="${s.w*W}" height="${s.h*H}" rx="${Math.min(s.w*W, s.h*H)*.12}" ${attrs}/>`;
}
function partReady(it, part){ const p = PHOTO[it.id]; return p && p.state === 'ok' && !!getShape(it, part.id); }

/* 사진과 터치 영역을 한 SVG 안에 두어서 화면 크기가 바뀌어도 좌표가 그대로 맞아요 */
function photoSVG(it, o){
  const ph = PHOTO[it.id], W = ph.W, H = ph.H;
  const vb = o.vb || [0, 0, W, H];
  let s = `<svg class="wsvg" id="wSvg" viewBox="${vb.join(' ')}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(it.name)} 사진">`;
  const part = o.part, shp = part ? getShape(it, part.id) : null;
  if (shp) s += `<defs><mask id="hl"><rect width="${W}" height="${H}" fill="white"/>${shapeSVG(shp, W, H, 'fill="black"')}</mask></defs>`;
  s += `<image href="${esc(it.photo)}" x="0" y="0" width="${W}" height="${H}"/>`;
  if (o.touch){
    const pad = Math.round(W * .025);
    const hit = `fill="transparent" stroke="transparent" stroke-width="${pad}" style="pointer-events:all;cursor:pointer"`;
    s += `<rect class="hs-miss" width="${W}" height="${H}" fill="transparent" style="pointer-events:all"/>`;
    const others = it.parts.filter(p => p.id !== part.id).map(p => ({id:p.id, name:p.name})).concat((it.others || []).map(p => ({id:p.id, name:p.name})));
    others.forEach(ot => { const sh = getShape(it, ot.id); if (sh) s += shapeSVG(sh, W, H, `class="hs" data-name="${esc(ot.name)}" ${hit}`); });
    s += shapeSVG(shp, W, H, `class="hs" data-target="1" ${hit}`);
  }
  if (o.highlight && shp){
    s += `<rect width="${W}" height="${H}" fill="rgba(0,0,0,.45)" mask="url(#hl)" style="pointer-events:none"/>`;
    s += shapeSVG(shp, W, H, `fill="none" stroke="#ffd23f" stroke-width="${Math.round(W*.012)}" class="glow" style="pointer-events:none"`);
    if (o.label){
      const b = bbox(shp);
      const lv = o.labelVb || vb, fs = Math.round(Math.min(lv[2], lv[3]) * .08);   // 확대돼 있으면 글자도 그만큼 작게
      s += `<text x="${(b.x + b.w/2)*W}" y="${Math.max(lv[1] + fs*1.1, b.y*H - fs*.3)}" text-anchor="middle" class="plabel" font-size="${fs}">${esc(part.name)}</text>`;
    }
  }
  if (o.marker){
    const m = o.marker;
    s += `<g style="pointer-events:none"><circle cx="${m.x}" cy="${m.y}" r="${W*.02}" fill="#fff" stroke="#2f7fc1" stroke-width="${W*.006}"/>
      ${m.name ? `<text x="${m.x}" y="${m.y - W*.035}" text-anchor="middle" class="plabel" font-size="${Math.round(Math.min(W,H)*.06)}">${esc(m.name)}</text>` : ''}</g>`;
  }
  return s + '</svg>';
}
function animateVB(svg, from, to, ms){
  if (!svg) return;
  const final = () => svg.setAttribute('viewBox', to.join(' '));
  if (!ms){ final(); return; }
  let t0 = null, done = false;
  const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
  function tick(now){
    if (done) return;
    if (t0 === null) t0 = now;
    const k = ease(Math.max(0, Math.min(1, (now - t0) / ms)));
    svg.setAttribute('viewBox', from.map((v,i) => (v + (to[i]-v)*k).toFixed(1)).join(' '));
    if (k < 1) requestAnimationFrame(tick); else done = true;
  }
  requestAnimationFrame(tick);
  setTimeout(() => { done = true; final(); }, ms + 150);
}

/* ---------- 진행 기록 ---------- */
function prog(itId){ return (store.prog[itId] = store.prog[itId] || {s1:0, parts:{}}); }
function pprog(itId, pid){ const p = prog(itId); return (p.parts[pid] = p.parts[pid] || {}); }
function itemComplete(it){   // 1단계 + 한 부분 이상 2·3·4단계
  const p = store.prog[it.id]; if (!p || !p.s1) return false;
  return Object.values(p.parts || {}).some(x => x.s2 && x.s3 && x.s4);
}
function maybeSticker(it){
  if (!store.stickers[it.id] && itemComplete(it)){ store.stickers[it.id] = today(); save(); return true; }
  return false;
}

function startQuiz(k){
  const it = curItem();
  if (k === 'qa'){
    const ready = it.parts.filter(p => partReady(it, p));
    const part = ready[Math.floor(Math.random() * ready.length)];
    go({screen:'qa', item:it.id, part:part.id, tries:0});
    speak(part.findQ); return;
  }
  const Q = k === 'qb' ? it.quizB : it.quizC;
  const opts = shuffle([{w:Q.ok, ok:true}, ...shuffle(Q.wrong).slice(0, store.nOpts - 1).map(w => ({w}))]);
  go({screen:k, item:it.id, part:S.part, opts, wrongs:[], solved:false, tries:0});
  speak(Q.q);
}

      ${ttsNote()}
      <div class="controls">
        <button class="btn btn-sun" id="again">🔊 질문 듣기</button>${solved ? '' : revealBtn()}
        <button class="btn btn-next ${solved?'pulse':''}" id="next" ${solved?'':'disabled'}>🔍 탐험으로 ▶</button>
      </div>
    </div>`;
  const svg = document.getElementById('wSvg');
  if (!solved) svg.addEventListener('click', ev => {
    const t = ev.target; S.tries++;
    let loc = null; try{ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; loc = pt.matrixTransform(svg.getScreenCTM().inverse()); }catch(e){}
    if (t.dataset && t.dataset.target){
      S.solved = true; S.marker = null;
      (store.quiz[it.id] = store.quiz[it.id] || {}).A = S.tries; save();
      renderQA(); praise('맞아요!'); speak(`맞아요! 여기가 ${it.name}의 ${part.name}${iy(part.name)}. ${part.sentence}`);
      return;
    }
    const nm2 = t.dataset && t.dataset.name ? t.dataset.name : '';
    S.marker = loc ? {x: loc.x, y: loc.y, name: nm2} : null;
    S.msg = nm2 ? `이건 ${nm2}${iy(nm2)}. ${eun(part.name)} 어디 있을까?` : `거기는 ${iga(part.name)} 아니야. 다시 찾아볼까?`;
    renderQA(); speak(S.msg);
  });
  document.getElementById('again').addEventListener('click', () => speak(solved ? part.sentence : part.findQ, true));
  document.getElementById('next').addEventListener('click', () => { if (S.solved) go({screen:'hub', item:it.id, part:S.part}); });
  bindCommon(renderQA);
}

/* ---------- 퀴즈 B·C: 숫자 보기 + 듣기 ---------- */
function renderQBC(){
  const it = curItem(), k = S.screen, Q = k === 'qb' ? it.quizB : it.quizC;
  const label = k === 'qb' ? '✋ B · 어떻게 움직일까?' : '⚙️ C · 무엇을 할까?';
  const show = textOn() || S.solved;
  app.innerHTML = `${topbar(3)}
    <div class="panel">
      <div class="qtext"><span class="chip">${label}</span>${textOn() ? `<p class="say">${esc(Q.q)}</p>` : sayBlock('')}</div>
      <div class="photowrap small">${photoSVG(it, {})}</div>
      <div class="bopts">
        ${S.opts.map((o,i) => { const wrong = S.wrongs.includes(i), right = S.solved && o.ok;
          return `<div class="bopt ${right?'right':''} ${wrong?'tried':''}">
            <button class="pick" data-i="${i}" ${S.solved?'disabled':''}><span class="n">${i+1}</span><span class="w">${show || wrong ? esc(o.w) : '● ● ●'}</span></button>
            <button class="listen" data-i="${i}" aria-label="${i+1}번 듣기">🔊 ${i+1}번 듣기</button></div>`; }).join('')}
      </div>
      ${S.solved ? `<div class="feedback fb-good" role="status">${esc(Q.yes)}</div>` : S.msg ? `<div class="feedback fb-hint" role="status">${textOn() ? esc(S.msg) : '🔊 다시 골라 볼까요?'}</div>` : ''}
      ${ttsNote()}
      <div class="controls">
        <button class="btn btn-sun" id="again">🔊 질문 듣기</button>${S.solved ? '' : revealBtn()}
        <button class="btn btn-next ${S.solved?'pulse':''}" id="next" ${S.solved?'':'disabled'}>🔍 탐험으로 ▶</button>
      </div>
    </div>`;
  app.querySelectorAll('.listen').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.i; speak(`${i+1}번, ${S.opts[i].w}`, true); }));
  app.querySelectorAll('.pick').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i, o = S.opts[i];
    if (S.solved) return;
    S.tries++;
    if (o.ok){
      S.solved = true; S.msg = '';
      (store.quiz[it.id] = store.quiz[it.id] || {})[k === 'qb' ? 'B' : 'C'] = S.tries; save();
      renderQBC(); praise('맞아요!'); speak(Q.yes);
    } else {
      if (!S.wrongs.includes(i)) S.wrongs.push(i);
      S.msg = `${DATA.wordInfo[o.w] || ''} 다시 골라 볼까?`.trim();
      renderQBC(); speak(S.msg);
    }
  }));
  document.getElementById('again').addEventListener('click', () => speak(S.solved ? Q.yes : Q.q, true));
  document.getElementById('next').addEventListener('click', () => { if (S.solved) go({screen:'hub', item:it.id, part:S.part}); });
  bindCommon(renderQBC);
}

/* ---------- 터치 영역 만들기 (보호자용) ---------- */
function renderEdit(){
  const it = itemById[S.eItem] || DATA.items[0];
  S.eItem = it.id;
  const ph = photoInfo(it);
  const targets = it.parts.map(p => ({id:p.id, name:p.name, kind:'부분'})).concat((it.others || []).map(p => ({id:p.id, name:p.name, kind:'다른 곳'})));
  if (!targets.find(t => t.id === S.eTarget)) S.eTarget = targets[0].id;
  const tg = targets.find(t => t.id === S.eTarget);
  const mode = S.eMode || 'shape', kind = S.eKind || 'rect';
  const ov = (store.overrides[it.id] || {})[tg.id] || {};
  app.innerHTML = `
    <div class="topbar"><button class="pill" id="toHome">🗺️ 처음으로</button></div>
    <div class="panel ed">
      <div class="qtext"><h1>📐 터치 영역 만들기</h1>
        <p class="small">사진 위에 손가락으로 끌어서 네모(또는 동그라미)를 그려요. 그린 영역은 이 기기에 바로 저장돼요. 모든 기기에 적용하려면 아래 '코드 복사'로 나온 내용을 전달해 주세요.</p></div>
      <div class="row"><label class="field" for="eItem">사물
        <select id="eItem">${DATA.items.map(x => `<option value="${x.id}" ${x.id===it.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div>
      <div class="targets">${targets.map(t => { const has = !!getShape(it, t.id);
        return `<button class="tbtn ${t.id===tg.id?'on':''} ${has?'set':''}" data-t="${t.id}">${t.kind}: ${esc(t.name)}</button>`; }).join('')}</div>
      <div class="row">
        <div class="seg"><button type="button" data-mode="shape" aria-pressed="${mode==='shape'}">터치 영역 그리기</button>${tg.kind === '부분' ? `<button type="button" data-mode="zoom" aria-pressed="${mode==='zoom'}">확대 범위 그리기</button>` : ''}</div>
        ${mode === 'shape' ? `<div class="seg"><button type="button" data-kind="rect" aria-pressed="${kind==='rect'}">▭ 네모</button><button type="button" data-kind="ellipse" aria-pressed="${kind==='ellipse'}">◯ 동그라미</button></div>` : ''}
      </div>
      ${ph.state === 'ok' ? `<div class="photowrap" id="edWrap">${editSVG(it, tg)}</div>`
        : `<div class="missing">${ph.state === 'missing' ? `📷 사진이 없어요: <code>word-game/${esc(it.photo)}</code>` : '사진 불러오는 중…'}</div>`}
      <div class="row">
        <button class="btn" type="button" id="eClear">이 항목 지우기</button>
        <button class="btn btn-sun" type="button" id="eCopy">📋 코드 복사</button>
        <span class="small" id="eMsg">${ov.shape || ov.zoom ? '이 기기에 저장됨' : ''}</span>
      </div>
      <div class="row" style="display:block"><textarea id="eCode" readonly aria-label="복사할 코드">${esc(codeFor(it))}</textarea></div>
    </div>`;
  document.getElementById('eItem').addEventListener('change', e => { S.eItem = e.target.value; S.eTarget = null; renderEdit(); });
  app.querySelectorAll('.tbtn').forEach(b => b.addEventListener('click', () => { S.eTarget = b.dataset.t; renderEdit(); }));
  app.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { S.eMode = b.dataset.mode; renderEdit(); }));
  app.querySelectorAll('[data-kind]').forEach(b => b.addEventListener('click', () => { S.eKind = b.dataset.kind; renderEdit(); }));
  document.getElementById('eClear').addEventListener('click', () => {
    const o = store.overrides[it.id] || {}; delete o[tg.id]; store.overrides[it.id] = o; save(); renderEdit();
  });
  document.getElementById('eCopy').addEventListener('click', () => {
    const ta = document.getElementById('eCode'), msg = document.getElementById('eMsg');
    const txt = ta.value;
    try{ navigator.clipboard.writeText(txt).then(() => { msg.textContent = '복사했어요'; }, () => { ta.select(); msg.textContent = '자동 복사가 안 돼요. 글자를 길게 눌러 복사해 주세요.'; }); }
    catch(e){ ta.select(); msg.textContent = '자동 복사가 안 돼요. 글자를 길게 눌러 복사해 주세요.'; }
  });
  if (ph.state === 'ok') bindDraw(it, tg);
  bindCommon(renderEdit);
}
function editSVG(it, tg){
  const ph = PHOTO[it.id], W = ph.W, H = ph.H;
  let s = `<svg class="wsvg" id="edSvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><image href="${esc(it.photo)}" width="${W}" height="${H}"/>`;
  it.parts.concat(it.others || []).forEach(p => {
    const sh = getShape(it, p.id); if (!sh) return;
    const on = p.id === tg.id;
    s += shapeSVG(sh, W, H, `fill="${on ? 'rgba(255,210,63,.25)' : 'rgba(79,155,224,.15)'}" stroke="${on ? '#ffb000' : '#4f9be0'}" stroke-width="${W*.006}"`);
    const b = bbox(sh);
    s += `<text x="${(b.x+b.w/2)*W}" y="${Math.max(.06,b.y-.015)*H}" text-anchor="middle" class="plabel" font-size="${Math.round(Math.min(W,H)*.05)}">${esc(p.name)}</text>`;
  });
  if (tg.kind === '부분' && getShape(it, tg.id)){
    const z = getZoom(it, tg.id);
    s += `<rect x="${z.x*W}" y="${z.y*H}" width="${z.w*W}" height="${z.h*H}" fill="none" stroke="#e5484d" stroke-width="${W*.005}" stroke-dasharray="${W*.02} ${W*.012}"/>`;
  }
  return s + `<rect id="edDraft" x="0" y="0" width="0" height="0" fill="rgba(46,158,98,.2)" stroke="#2e9e62" stroke-width="${W*.006}"/></svg>`;
}
function bindDraw(it, tg){
  const svg = document.getElementById('edSvg'), ph = PHOTO[it.id];
  const draft = document.getElementById('edDraft');
  let start = null;
  const toPt = ev => { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return {x: Math.max(0, Math.min(ph.W, p.x)), y: Math.max(0, Math.min(ph.H, p.y))}; };
  svg.addEventListener('pointerdown', ev => { ev.preventDefault(); start = toPt(ev); try{ svg.setPointerCapture(ev.pointerId); }catch(e){} });
  svg.addEventListener('pointermove', ev => {
    if (!start) return; const p = toPt(ev);
    draft.setAttribute('x', Math.min(start.x, p.x)); draft.setAttribute('y', Math.min(start.y, p.y));
    draft.setAttribute('width', Math.abs(p.x - start.x)); draft.setAttribute('height', Math.abs(p.y - start.y));
  });
  svg.addEventListener('pointerup', ev => {
    if (!start) return; const p = toPt(ev);
    const x = Math.min(start.x, p.x) / ph.W, y = Math.min(start.y, p.y) / ph.H, w = Math.abs(p.x - start.x) / ph.W, h = Math.abs(p.y - start.y) / ph.H;
    start = null;
    if (w < .02 || h < .02){ draft.setAttribute('width', 0); return; }   // 너무 작으면 무시
    const r3 = v => Math.round(v * 1000) / 1000;
    const o = (store.overrides[it.id] = store.overrides[it.id] || {}), cur = (o[tg.id] = o[tg.id] || {});
    if ((S.eMode || 'shape') === 'zoom') cur.zoom = {x:r3(x), y:r3(y), w:r3(w), h:r3(h)};
    else cur.shape = (S.eKind || 'rect') === 'ellipse'
      ? {t:'ellipse', cx:r3(x + w/2), cy:r3(y + h/2), rx:r3(w/2), ry:r3(h/2)}
      : {t:'rect', x:r3(x), y:r3(y), w:r3(w), h:r3(h)};
    save(); renderEdit();
  });
}
function codeFor(it){
  const fmt = s => s ? JSON.stringify(s).replace(/"(\w+)":/g, '$1:').replace(/"/g, "'") : 'null';
  const lines = [`/* ${it.name} (${it.id}) — words.js에 붙여 넣을 값 */`];
  it.parts.forEach(p => { const ov = (store.overrides[it.id] || {})[p.id] || {};
    lines.push(`${p.id} (${p.name}): shape:${fmt(ov.shape || p.shape)}, zoom:${fmt(ov.zoom || p.zoom)}`); });
  (it.others || []).forEach(p => { const ov = (store.overrides[it.id] || {})[p.id] || {};
    lines.push(`${p.id} (${p.name}, 다른 곳): shape:${fmt(ov.shape || p.shape)}`); });
  return lines.join('\n');
}

/* ---------- 부모님 ---------- */
function parentHTML(){
  const tag = n => !n ? '<span class="tag t0">-</span>' : n===1 ? '<span class="tag t1">한 번에</span>' : n===2 ? '<span class="tag t2">두 번째</span>' : `<span class="tag t3">${n}번째</span>`;
  const said = v => v === 'full' ? '<span class="tag t1">문장</span>' : v === 'part' ? '<span class="tag t2">단어·일부</span>' : '<span class="tag t0">-</span>';
  const rows = DATA.items.filter(it => store.prog[it.id] || store.quiz[it.id]).map(it => {
    const p = store.prog[it.id] || {parts:{}}, q = store.quiz[it.id] || {};
    const partTxt = it.parts.map(pt => { const r = (p.parts || {})[pt.id] || {}; return `${esc(pt.name)}: 찾기 ${tag(r.s2)} 말하기 ${said(r.s4)}`; }).join('<br>');
    return `<tr><td>${esc(it.name)}<br><span class="small">${p.at || ''}</span>${store.stickers[it.id] ? ' ⭐' : ''}</td><td>${partTxt}</td><td>A ${tag(q.A)}<br>B ${tag(q.B)}<br>C ${tag(q.C)}</td></tr>`; }).join('');
  const missing = DATA.items.filter(it => (PHOTO[it.id] || {}).state === 'missing');
  return `<details class="parent"><summary>부모님 설정 · 기록</summary>
    <div class="form">
      <label class="field" for="nameIn">아이 이름<input type="text" id="nameIn" maxlength="8" value="${esc(store.name)}"></label>
      <div class="field">글자 표시
        <div class="seg"><button type="button" data-tm="voice" aria-pressed="${store.textMode==='voice'}">그림·음성 중심 (기본)</button><button type="button" data-tm="text" aria-pressed="${store.textMode==='text'}">그림·글자·음성 함께</button></div>
        <span class="small">그림·음성 중심에서는 사물 이름과 정답 단어를 처음에 숨기고 소리로 들려줘요. 숫자는 항상 보여요. 소리가 안 나면 '👀 글자 보기'를 눌러요.</span></div>
      <label class="check" for="readIn"><input type="checkbox" id="readIn" ${store.autoRead?'checked':''}> 화면마다 소리 내어 읽어주기</label>
      <div class="field">보기 개수
        <div class="seg"><button type="button" data-n="2" aria-pressed="${store.nOpts===2}">2개 (쉬움)</button><button type="button" data-n="3" aria-pressed="${store.nOpts===3}">3개</button></div></div>
      <label class="field" for="voiceSel">목소리<select id="voiceSel"><option value="">자동 선택</option></select></label>
      <div class="testrow"><button class="btn btn-sun" type="button" id="soundTestBtn">🔊 소리 테스트</button><button class="btn" type="button" id="beepBtn">🔔 삐 소리 테스트</button><button class="btn" type="button" id="plainBtn">🗣️ 기본 목소리로 테스트</button></div>
      <p class="small">아이패드에서 소리가 안 나면 먼저 제어센터의 🔔 무음 모드가 꺼져 있는지 확인해 주세요.</p>
      <div class="field">음성 상태<div id="voiceStatus" class="vbox"></div></div>
      <div><button class="btn" type="button" id="editBtn">📐 터치 영역 만들기</button></div>
      ${missing.length ? `<p class="small">📷 사진이 필요한 사물: ${missing.map(it => `${esc(it.name)} (<code>word-game/${esc(it.photo)}</code>)`).join(', ')}</p>` : ''}
    </div>
    ${rows ? `<div style="overflow-x:auto"><table><thead><tr><th>사물</th><th>부분별 (2 찾기 · 4 말하기)</th><th>퀴즈</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="small">아직 기록이 없어요.</p>'}
    <p class="small">기록과 스티커, 이 기기에서 그린 터치 영역은 이 기기에만 저장돼요. 사진 출처: <a href="photos/CREDITS.md">사진 출처 목록</a></p>
    <p><button class="btn" type="button" id="resetBtn">스티커와 기록 지우기</button></p>
  </details>`;
}
let resetArmed = false;
function bindParent(){
  const n = document.getElementById('nameIn');
  if (n) n.addEventListener('change', e => { store.name = e.target.value.trim() || '토리'; save(); renderHome(); });
  const r = document.getElementById('readIn');
  if (r) r.addEventListener('change', e => { store.autoRead = e.target.checked; save(); });
  const reopen = () => { renderHome(); app.querySelector('details.parent').open = true; };
  app.querySelectorAll('.seg button[data-tm]').forEach(b => b.addEventListener('click', () => { store.textMode = b.dataset.tm; save(); reopen(); }));
  app.querySelectorAll('.seg button[data-n]').forEach(b => b.addEventListener('click', () => { store.nOpts = +b.dataset.n; save(); reopen(); }));
  const t = document.getElementById('soundTestBtn'); if (t) t.addEventListener('click', soundTest);
  const bb = document.getElementById('beepBtn'); if (bb) bb.addEventListener('click', beepTest);
  const pb = document.getElementById('plainBtn'); if (pb) pb.addEventListener('click', plainVoiceTest);
  const vs = document.getElementById('voiceSel');
  if (vs) vs.addEventListener('change', e => { store.voiceURI = e.target.value; save(); V.bad.clear(); loadVoices(); vlog('목소리 바꿈: ' + (e.target.value ? (V.chosen ? V.chosen.name : e.target.value) : '자동 선택')); });
  updateVoiceStatus();
  const eb = document.getElementById('editBtn'); if (eb) eb.addEventListener('click', () => go({screen:'edit', eItem: DATA.items[0].id}));
  const rs = document.getElementById('resetBtn');
  if (rs) rs.addEventListener('click', () => {
    if (!resetArmed){ resetArmed = true; rs.textContent = '정말 지울까요? 한 번 더 누르면 지워져요 (터치 영역은 남아요)'; return; }
    store.stickers = {}; store.prog = {}; store.quiz = {}; save(); resetArmed = false; renderHome();
  });
  /* 사진이 있는지 미리 확인해서 '사진 필요' 목록을 채워요 */
  DATA.items.forEach(it => photoInfo(it));
}

function render(){
  const f = {home:renderHome, cat:renderCat, hub:renderHub, s1:renderS1, s2:renderS2, s3:renderS3, s4:renderS4, qa:renderQA, qb:renderQBC, qc:renderQBC, sticker:renderSticker, edit:renderEdit}[S.screen] || renderHome;
  f();
  if (S.screen !== 'home') window.scrollTo({top:0, behavior: reduceMotion ? 'auto' : 'smooth'});
}
render();
</script>
