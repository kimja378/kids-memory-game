<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콩이랑 같이 놀자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  /* 그림책 세계 하나로 고정된 밝은 화면: 위에 그림, 아래 큰 글씨와 큰 버튼 */
  --bg:#e4f2ee;
  --paper:#fffdf8;
  --ink:#2b3640;
  --muted:#5f6f7b;
  --accent:#2f7fc1;
  --sun:#ffc63d;
  --good:#2e9e62;
  --line:#d3e3df;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
.book{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--paper);border-radius:24px;box-shadow:0 8px 28px rgba(40,80,90,.13);overflow:hidden}
.progress{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:12px 16px 10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.q{border-radius:3px;transform:rotate(45deg)}
.dot.done{background:var(--good)}
.dot.now{background:var(--sun);box-shadow:0 0 0 3px #ffe9a8}
.stage{position:relative;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.text{padding:18px 24px 6px;font-family:var(--display);font-size:clamp(22px,4.8vw,30px);line-height:1.55}
.text p{margin:0 0 4px}
.chip{display:inline-block;font-family:var(--display);font-size:17px;background:#ffe9a8;color:#6b4c00;border-radius:999px;padding:3px 12px;margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 18px 14px}
.opt{border:4px solid var(--line);border-radius:20px;background:#fff;padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:clamp(18px,4.2vw,24px);color:var(--ink);cursor:pointer;min-height:160px;transition:transform .15s,border-color .2s}
.opt:hover{transform:translateY(-3px);border-color:#a9cbe6}
.opt:focus-visible,.btn:focus-visible,input:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.opt .ic{font-size:60px;line-height:1}
.opt svg{width:72px;height:96px}
.opt.right{border-color:var(--good);background:#e5f6ec}
.opt.nope{opacity:.4;animation:wobble .45s;cursor:default}
.opt:disabled{cursor:default}
.feedback{margin:0 18px 6px;padding:12px 16px;border-radius:16px;font-family:var(--display);font-size:clamp(18px,4vw,23px);line-height:1.45}
.fb-good{background:#e5f6ec;color:#1b6640}
.fb-hint{background:#fff3cf;color:#6e4e00}
.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 18px}
.btn{font-family:var(--display);font-size:clamp(18px,4vw,22px);border:none;border-radius:999px;padding:12px 22px;cursor:pointer;color:var(--ink)}
.btn-next{background:var(--accent);color:#fff;min-width:120px}
.btn-next:disabled{background:#c8d5dc;color:#6f7f88;cursor:not-allowed}
.btn-ghost{background:#edf3f5}
.btn-ghost[hidden]{display:inline-block;visibility:hidden}
.btn-read{background:var(--sun);color:#3d2c00}
.pulse{animation:pulse 1.2s ease-in-out infinite}
.cover-form{display:grid;gap:14px;padding:6px 24px 4px}
.field{display:grid;gap:6px;font-size:17px;color:var(--muted)}
.field input[type=text]{font-family:var(--display);font-size:24px;padding:10px 14px;border-radius:14px;border:3px solid var(--line);color:var(--ink);background:#fff;max-width:280px}
.check{display:flex;align-items:center;gap:10px;font-size:18px;color:var(--ink)}
.check input{width:24px;height:24px}
.note{font-size:16px;line-height:1.6;color:var(--muted);background:#f2f7f6;border-radius:14px;padding:12px 16px;margin:0}
.report{padding:6px 22px 4px}
.report h2{font-family:var(--display);font-weight:400;font-size:24px;margin:8px 0 6px;text-wrap:balance}
.report .sum{font-size:18px;margin:0 0 12px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:16px}
.row small{display:block;color:var(--muted);font-size:14px}
.tag{font-family:var(--display);font-size:15px;border-radius:999px;padding:4px 12px;white-space:nowrap}
.t1{background:#dff3e7;color:#1b6640}
.t2{background:#fff0c7;color:#6e4e00}
.t3{background:#fde0d8;color:#8a3a22}
.star{position:absolute;font-size:30px;color:var(--sun);pointer-events:none;text-shadow:0 1px 0 #d99a00;animation:pop 1.3s ease-out forwards}
.bigstar{font-family:var(--display);font-size:clamp(24px,5vw,32px);color:#c77d00;padding:6px 24px 0}

/* 그림 속 움직임 */
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.bob.b2{animation-delay:-1.2s}
.eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
.wave{animation:wave 1s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 90%}
.tear{animation:drip 1.4s ease-in infinite}
.cloud{animation:drift 14s linear infinite alternate}
.chars.jump .bob{animation:jump .7s ease-out 2}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(18deg)}}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(40px)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-26px)}}
@keyframes wobble{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes pop{0%{transform:translateY(0) scale(.4);opacity:1}100%{transform:translateY(-90px) scale(1.2);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.opt{min-height:140px}.opt .ic{font-size:50px}.controls{padding:12px}}
</style>
</head>
<body>
<main class="book">
  <div class="card" id="card"></div>
</main>

/* ---------- 이름과 조사 ---------- */
let rawName = '토리';
function hasBatchim(w){
  const c = w.charCodeAt(w.length-1);
  if (c < 0xAC00 || c > 0xD7A3) return false;
  return (c - 0xAC00) % 28 !== 0;
}
function callName(){ return hasBatchim(rawName) ? rawName + '이' : rawName; }
function vocative(){
  if (hasBatchim(rawName)) return rawName + '아';
  if (rawName.length >= 2 && rawName.endsWith('이') && hasBatchim(rawName.slice(0,-1))) return rawName.slice(0,-1) + '아';
  return rawName + '야';
}
function fill(t){
  return t.replace(/\{N(는|가|도|와|를|야)?\}/g, (m, j) => {
    if (j === '야') return vocative();
    return callName() + (j || '');
  });
}

/* ---------- 캐릭터 그림 ---------- */
function face(mood){
  if (mood === 'cry') return `
    <path d="M-16 -13 Q-11 -9 -6 -13" stroke="#2b2420" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M6 -13 Q11 -9 16 -13" stroke="#2b2420" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse class="tear" cx="-14" cy="-4" rx="3" ry="5" fill="#6cc3f2"/>
    <ellipse class="tear" cx="14" cy="-4" rx="3" ry="5" fill="#6cc3f2" style="animation-delay:-.7s"/>`;
  const browL = mood === 'worry' ? '<path d="M-17 -22 L-7 -25" stroke="#2b2420" stroke-width="2.5" stroke-linecap="round"/>' : '';
  const browR = mood === 'worry' ? '<path d="M7 -25 L17 -22" stroke="#2b2420" stroke-width="2.5" stroke-linecap="round"/>' : '';
  return `${browL}${browR}
    <g class="eye"><circle cx="-11" cy="-14" r="4" fill="#2b2420"/><circle cx="-9.6" cy="-15.4" r="1.3" fill="#fff"/></g>
    <g class="eye"><circle cx="11" cy="-14" r="4" fill="#2b2420"/><circle cx="12.4" cy="-15.4" r="1.3" fill="#fff"/></g>`;
}
function mouth(mood, y){
  if (mood === 'cry') return `<path d="M-7 ${y+7} Q0 ${y-1} 7 ${y+7}" stroke="#2b2420" stroke-width="2.6" fill="#c94f4f" stroke-linecap="round"/>`;
  if (mood === 'worry') return `<ellipse cx="0" cy="${y+3}" rx="4" ry="5" fill="#2b2420"/>`;
  return `<path d="M-7 ${y} Q0 ${y+9} 7 ${y}" stroke="#2b2420" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
}
/* 흔드는 팔: 어깨(몸 안쪽)를 축으로 회전하고, 몸 뒤에 그려서 이음새가 가려지게 함 */
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; } })();
function waveArm(sx, sy, rx, ry, fill, stroke){
  const st = stroke ? `stroke="${stroke}" stroke-width="2"` : '';
  const anim = reduceMotion ? '' : `<animateTransform attributeName="transform" type="rotate" values="25;60;25" dur="1s" repeatCount="indefinite"/>`;
  return `<g transform="translate(${sx} ${sy})"><g transform="rotate(40)">
    <ellipse cx="0" cy="${-ry+5}" rx="${rx}" ry="${ry}" fill="${fill}" ${st}/>${anim}</g></g>`;
}
function bear(x, y, s=1, mood='happy', opt={}){
  const armBack = opt.wave ? waveArm(20, 28, 9, 17, '#a56b3f') : '';
  const armR = opt.wave ? ''
    : `<ellipse cx="29" cy="40" rx="9" ry="17" fill="#a56b3f" transform="rotate(${opt.reach ? -70 : -15} 29 40)"/>`;
  return `<g transform="translate(${x} ${y}) scale(${s})"><g class="bob ${opt.cls||''}">
    ${armBack}
    <ellipse cx="0" cy="44" rx="30" ry="32" fill="#a56b3f"/>
    <ellipse cx="0" cy="50" rx="18" ry="20" fill="#e8c39a"/>
    <ellipse cx="-29" cy="40" rx="9" ry="17" fill="#a56b3f" transform="rotate(15 -29 40)"/>
    ${armR}
    <ellipse cx="-14" cy="74" rx="12" ry="7" fill="#8d5832"/>
    <ellipse cx="14" cy="74" rx="12" ry="7" fill="#8d5832"/>
    <circle cx="-25" cy="-35" r="12" fill="#a56b3f"/><circle cx="-25" cy="-35" r="6" fill="#e8c39a"/>
    <circle cx="25" cy="-35" r="12" fill="#a56b3f"/><circle cx="25" cy="-35" r="6" fill="#e8c39a"/>
    ${usePhoto ? `
    <circle cx="0" cy="-8" r="35" fill="#a56b3f"/>
    <image href="${mood === 'worry' ? FACE_WORRY : FACE_HAPPY}" x="-31" y="-39" width="62" height="62"/>
    <circle cx="0" cy="-8" r="31" fill="none" stroke="#a56b3f" stroke-width="1.5"/>` : `

    ${face(mood)}${mouth(mood, 8)}`}
    <path d="M-22 26 Q0 36 22 26 L18 34 Q0 42 -18 34 Z" fill="#e85d5d"/>
  </g></g>`;
}
function rabbit(x, y, s=1, mood='happy', opt={}){
  const armBack = opt.wave ? waveArm(16, 30, 8, 15, '#f4f1ee', '#e2dcd6') : '';
  const armR = opt.wave ? ''
    : `<ellipse cx="26" cy="42" rx="8" ry="15" fill="#f4f1ee" stroke="#e2dcd6" stroke-width="2" transform="rotate(-15 26 42)"/>`;

}

function blocks(x, baseY, n){
  const cols = ['#ef6b6b','#4f9be0','#ffc63d','#5cbf86','#b78be0'];
  let out = '';
  for (let i=0;i<n;i++){
    const off = (i%2 ? 4 : -4);
    out += `<rect x="${x-15+off}" y="${baseY-18*(i+1)}" width="30" height="18" rx="3" fill="${cols[i%cols.length]}" stroke="rgba(0,0,0,.12)"/>`;
  }
  return out;
}

    <g class="chars">${rabbit(120,150,1,'happy')}${bear(300,150,1,'happy')}</g>`,
  tower: () => `${classroom}
    ${blocks(200,222,7)}
    <g class="chars">${rabbit(120,150,1,'happy',{wave:true})}${bear(285,150,1,'happy',{wave:true})}</g>`,
  line: () => `${sky('#c9ecfd')}${cloud(70,40)}${cloud(200,30)}
    <circle cx="40" cy="36" r="18" fill="#ffd84d"/>
    ${grass}
    <rect x="300" y="95" width="6" height="115" fill="#e85d5d"/><rect x="324" y="95" width="6" height="115" fill="#e85d5d"/>
    <path d="M300 120 H330 M300 145 H330 M300 170 H330 M300 195 H330" stroke="#e85d5d" stroke-width="5"/>
    <rect x="296" y="88" width="40" height="10" rx="4" fill="#4f9be0"/>
    <path d="M330 92 Q370 110 395 205 L380 208 Q360 125 330 104Z" fill="#ffc63d"/>
    <path d="M235 214 L262 214" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9"/>
    <g class="chars">${bear(150,148,0.95,'happy')}${rabbit(255,148,0.95,'happy')}</g>`,
  fall: () => `${sky('#c9ecfd')}${cloud(90,36)}${cloud(280,30)}${grass}
    <text x="285" y="122" font-family="Jua, sans-serif" font-size="26" fill="#e85d5d" transform="rotate(-10 285 122)">꽈당!</text>
    <path d="M200 222 q8 -10 16 0 M270 222 q8 -10 16 0" stroke="#c9b28c" stroke-width="3" fill="none"/>
    <g class="chars">${bear(110,148,1,'worry')}${rabbit(245,152,0.95,'cry')}</g>`,
  help: () => `${sky('#c9ecfd')}${cloud(60,40)}${cloud(300,30)}${grass}
    <text x="192" y="76" font-family="sans-serif" font-size="26" fill="#ef6b8a">♥</text>
    <text x="214" y="58" font-family="sans-serif" font-size="18" fill="#ef6b8a">♥</text>
    <g class="chars">${bear(150,148,1,'happy',{reach:true})}${rabbit(255,150,0.95,'happy')}</g>`,
  bye: () => `<rect width="400" height="260" fill="#ffd8a8"/><rect y="0" width="400" height="90" fill="#ffc1a0"/>
    <circle cx="320" cy="150" r="40" fill="#ffa86b" opacity=".8"/>
    <rect x="20" y="110" width="110" height="95" fill="#ffe3a6"/><path d="M10 112 L75 66 L140 112Z" fill="#ef7b5f"/>
    <rect x="60" y="150" width="30" height="55" rx="4" fill="#7cc4e8"/>
    <rect y="200" width="400" height="60" fill="#b9d98a"/>
    <g class="chars">${bear(205,148,1,'happy',{wave:true})}${rabbit(315,150,0.95,'happy',{wave:true})}</g>`
};

/* ---------- 이야기 ---------- */
const pages = [
  {type:'cover', scene:'tower'},
  {type:'story', scene:'door', text:['아침이에요.','{N는} 어린이집에 왔어요.','오리 선생님이 웃으며 기다려요.']},
  {type:'q', id:'q1', kind:'인사하기', scene:'door', q:'선생님을 만나면 어떻게 할까요?',
    opts:[{icon:'👋',label:'"안녕하세요!" 인사해요',ok:true},{icon:'🙈',label:'얼굴을 가리고 숨어요'}],
    hint:'누구를 만나면 반갑게 인사를 해요.', yes:'맞아요! 선생님도 "{N야}, 안녕!" 하고 반겨 주었어요.'},
  {type:'story', scene:'class', text:['교실에 들어갔어요.','토끼 콩이가 블록을 쌓고 있어요.','{N도} 같이 놀고 싶어요.']},
  {type:'q', id:'q2', kind:'놀이 함께하기', scene:'class', q:'같이 놀고 싶을 때는 어떻게 할까요?',
    opts:[{icon:'🤝',label:'"같이 놀자!" 말해요',ok:true},{icon:'✋',label:'블록을 그냥 가져가요'}],
    hint:'블록을 그냥 가져가면 콩이가 속상해요. 말로 물어봐요.', yes:'맞아요! 콩이가 "좋아!" 하고 대답했어요.'},
  {type:'story', scene:'tower', text:['{N와} 콩이는 함께 블록을 쌓았어요.','하나, 둘, 셋!','와, 탑이 아주 높아졌어요!']},
  {type:'q', id:'q3', kind:'내용 이해', scene:'tower', q:'콩이는 어떤 동물이었나요?',
    opts:[{icon:'🐰',label:'토끼',ok:true},{icon:'🐶',label:'강아지'}],
    hint:'콩이는 귀가 길~고 깡충깡충 뛰어요.', yes:'맞아요! 콩이는 귀가 긴 토끼예요.'},
  {type:'story', scene:'line', text:['바깥 놀이 시간이에요.','미끄럼틀 앞에 줄을 서요.','콩이가 먼저 섰고, {N는} 콩이 뒤에 섰어요.']},
  {type:'q', id:'q4', kind:'차례 지키기', scene:'line', q:'미끄럼틀을 먼저 타는 친구는 누구일까요?',
    opts:[{icon:'rabbit',label:'콩이',ok:true},{icon:'bear',label:'{N}'}],
    hint:'줄을 먼저 선 친구가 먼저 타요. 미끄럼틀 바로 앞에 누가 있나요?', yes:'맞아요! 콩이가 먼저 슝~ 그 다음은 {N} 차례예요.'},
  {type:'story', scene:'fall', text:['콩이가 달리다가 꽈당! 넘어졌어요.','콩이가 엉엉 울어요.']},
  {type:'q', id:'q5', kind:'친구 마음 알기', scene:'fall', q:'콩이 기분은 어떨까요?',
    opts:[{icon:'😢',label:'아프고 슬퍼요',ok:true},{icon:'😄',label:'신나고 기뻐요'}],
    hint:'콩이 얼굴을 봐요. 눈물이 나고 있어요.', yes:'맞아요. 넘어져서 아프고 슬퍼요.'},
  {type:'q', id:'q6', kind:'친구 도와주기', scene:'fall', q:'친구가 울고 있을 때는 어떻게 할까요?',
    opts:[{icon:'🤗',label:'"괜찮아?" 물어봐요',ok:true},{icon:'🏃',label:'못 본 척 가요'}],
    hint:'친구가 아플 때는 다가가서 괜찮은지 물어봐요.', yes:'맞아요! 친구를 걱정해 주는 거예요.'},
  {type:'story', scene:'help', text:['"콩이야, 괜찮아?"','{N가} 손을 내밀었어요.','콩이가 눈물을 닦고 웃었어요. "고마워!"']},
  {type:'q', id:'q7', kind:'기억하기', scene:'help', q:'오늘 {N와} 콩이는 교실에서 무엇을 하고 놀았나요?',
    opts:[{icon:'🧱',label:'블록 쌓기',ok:true},{icon:'⚽',label:'공 차기'}],
    hint:'교실에서 알록달록한 것을 높이 쌓았어요.', yes:'맞아요! 블록을 높이높이 쌓았어요.'},
  {type:'end', scene:'bye', text:['집에 갈 시간이에요.','"콩이야, 내일 또 만나!"','{N는} 손을 흔들었어요.']}
];

/* ---------- 상태 ---------- */
let idx = 0;
let autoRead = true;
let attempts = {}, solved = {}, wrongPicked = {}, orders = {};
let showReport = false;

/* ---------- 읽어주기 ---------- */
let koVoice = null;
function pickVoice(){
  try{ const vs = speechSynthesis.getVoices(); koVoice = vs.find(v => v.lang && v.lang.toLowerCase().startsWith('ko')) || null; }catch(e){}
}
if ('speechSynthesis' in window){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function speak(text){
  if (!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/["“”]/g,''));
    u.lang = 'ko-KR'; if (koVoice) u.voice = koVoice;
    u.rate = 0.85; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function pageSpeech(p){
  if (p.type === 'story' || p.type === 'end') return fill(p.text.join(' '));
  if (p.type === 'q'){
    if (solved[p.id]) return fill(p.yes);
    const o = orders[p.id].map(i => fill(p.opts[i].label));
    return fill(p.q) + ' ' + o[0] + '? 아니면, ' + o[1] + '?';
  }
  return '콩이랑 같이 놀자.';
}

/* ---------- 그리기 ---------- */
const card = document.getElementById('card');
function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function iconHTML(icon){
  if (icon === 'bear') return `<svg viewBox="-48 -52 96 132" aria-hidden="true">${bear(0,0,1)}</svg>`;
  if (icon === 'rabbit') return `<svg viewBox="-48 -90 96 170" aria-hidden="true">${rabbit(0,0,1)}</svg>`;
  return `<span class="ic" aria-hidden="true">${icon}</span>`;
}
function progressHTML(){
  return pages.slice(1).map((p,i) => {
    const n = i+1;
    const cls = ['dot', p.type==='q' ? 'q' : '', n < idx ? 'done' : '', n === idx ? 'now' : ''].join(' ');
    return `<span class="${cls}"></span>`;
  }).join('');
}
function render(){
  const p = pages[idx];
  if (p.type === 'q' && !orders[p.id]) orders[p.id] = Math.random() < .5 ? [0,1] : [1,0];
  let body = '';
  let nextLabel = '다음 ▶', nextDisabled = false, nextPulse = false;

  if (p.type === 'cover'){
    body = `
      <div class="text"><p>콩이랑 같이 놀자</p></div>
      <div class="cover-form">
        <label class="field" for="nameInput">주인공 이름 (아이 이름을 넣어도 좋아요)
          <input type="text" id="nameInput" maxlength="8" value="${esc(rawName)}">
        </label>
        <label class="check" for="usePhoto"><input type="checkbox" id="usePhoto" ${usePhoto?'checked':''}> 곰돌이 얼굴을 아이 사진으로 보기</label>
        <label class="check" for="autoRead"><input type="checkbox" id="autoRead" ${autoRead?'checked':''}> 장면마다 소리 내어 읽어주기</label>
        <p class="note">중간중간 질문이 나와요. 정답을 고르면 다음 장면으로 넘어가고, 틀리면 힌트가 나와요. 마지막 장에서 아이가 각 질문을 몇 번 만에 맞혔는지 볼 수 있어요.</p>
      </div>`;
    nextLabel = '시작하기 ▶';
  } else if (p.type === 'story' || p.type === 'end'){
    body = `<div class="text">${p.text.map(t => `<p>${esc(fill(t))}</p>`).join('')}</div>`;
    if (p.type === 'end'){
      body += `<div class="bigstar">★ 끝까지 잘 들었어요! ★</div>`;
      if (showReport) body += reportHTML();
      nextLabel = '처음부터 다시';
    }
  } else if (p.type === 'q'){
    const done = !!solved[p.id];
    const opts = orders[p.id].map(i => {
      const o = p.opts[i];
      const wrong = (wrongPicked[p.id]||[]).includes(i);
      const cls = ['opt', done && o.ok ? 'right' : '', wrong ? 'nope' : ''].join(' ');
      return `<button class="${cls}" data-i="${i}" ${done||wrong?'disabled':''}>${iconHTML(o.icon)}<span>${esc(fill(o.label))}</span></button>`;
    }).join('');
    let fb = '';
    if (done) fb = `<div class="feedback fb-good" role="status">${esc(fill(p.yes))}</div>`;
    else if ((wrongPicked[p.id]||[]).length) fb = `<div class="feedback fb-hint" role="status">다시 생각해 볼까요? ${esc(fill(p.hint))}</div>`;
    body = `<div class="text"><span class="chip">질문</span><p>${esc(fill(p.q))}</p></div><div class="opts">${opts}</div>${fb}`;
    nextDisabled = !done; nextPulse = done;
  }

  card.innerHTML = `
    <div class="progress" aria-hidden="true">${idx>0?progressHTML():''}</div>
    <div class="stage" id="stage"><svg viewBox="0 0 400 260" role="img" aria-label="그림">${scenes[p.scene]()}</svg></div>
    ${body}
    <div class="controls">
      <button class="btn btn-ghost" id="prevBtn" ${idx===0?'hidden':''}>◀ 이전</button>
      ${p.type==='end' ? `<button class="btn btn-ghost" id="reportBtn">${showReport?'기록 닫기':'부모님 확인'}</button>` : `<button class="btn btn-read" id="readBtn">🔊 읽어주기</button>`}
      <button class="btn btn-next ${nextPulse?'pulse':''}" id="nextBtn" ${nextDisabled?'disabled':''}>${nextLabel}</button>
    </div>`;
  bind();
}
function reportHTML(){
  const qs = pages.filter(p => p.type === 'q');
  const first = qs.filter(q => attempts[q.id] === 1).length;
  const rows = qs.map(q => {
    const a = attempts[q.id] || 0;
    let tag;
    if (!solved[q.id]) tag = '<span class="tag t3">못 풀었어요</span>';
    else if (a === 1) tag = '<span class="tag t1">한 번에 맞힘</span>';
    else if (a === 2) tag = '<span class="tag t2">두 번째에 맞힘</span>';
    else tag = `<span class="tag t3">${a}번째에 맞힘</span>`;
    return `<div class="row"><div>${esc(fill(q.q))}<small>${q.kind}</small></div>${tag}</div>`;
  }).join('');
  return `<section class="report">
    <h2>부모님 확인</h2>
    <p class="sum">질문 ${qs.length}개 중 <strong>${first}개</strong>를 한 번에 맞혔어요.</p>
    ${rows}
    <p class="note" style="margin:14px 0 4px">보기가 두 개라서 우연히 맞힐 수도 있어요. 정답을 고른 뒤 "왜 그렇게 생각했어?" 하고 한 번 더 물어보면 정말 이해했는지 알기 쉬워요. 여러 번 해 보며 결과가 어떻게 달라지는지 비교해 보세요.</p>
  </section>`;
}
function celebrate(){
  const stage = document.getElementById('stage');
  const chars = stage.querySelector('.chars');
  if (chars){ chars.classList.add('jump'); }
  for (let i=0;i<14;i++){
    const s = document.createElement('span');
    s.className = 'star'; s.textContent = '★';
    s.style.left = (8 + Math.random()*84) + '%';
    s.style.top = (35 + Math.random()*50) + '%';
    s.style.animationDelay = (Math.random()*.4) + 's';
    stage.appendChild(s);
    setTimeout(() => s.remove(), 1900);
  }
}
function go(n){
  idx = n; render(); window.scrollTo({top:0, behavior:'smooth'});
  if (autoRead && idx > 0) speak(pageSpeech(pages[idx]));
}
function bind(){
  const p = pages[idx];
  const nameI = document.getElementById('nameInput');
  if (nameI) nameI.addEventListener('input', e => { rawName = e.target.value.trim() || '토리'; });
  const up = document.getElementById('usePhoto');
  if (up) up.addEventListener('change', e => { usePhoto = e.target.checked; render(); });
  const ar = document.getElementById('autoRead');
  if (ar) ar.addEventListener('change', e => { autoRead = e.target.checked; });
  const prev = document.getElementById('prevBtn');
  if (prev) prev.addEventListener('click', () => { if (idx>0) go(idx-1); });
  const read = document.getElementById('readBtn');
  if (read) read.addEventListener('click', () => speak(pageSpeech(p)));
  const rep = document.getElementById('reportBtn');
  if (rep) rep.addEventListener('click', () => { showReport = !showReport; render(); });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (p.type === 'end'){ attempts={}; solved={}; wrongPicked={}; orders={}; showReport=false; go(0); return; }
    if (p.type === 'q' && !solved[p.id]) return;
    go(idx+1);
  });
  card.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => {
    if (solved[p.id]) return;
    const i = +btn.dataset.i, o = p.opts[i];
    attempts[p.id] = (attempts[p.id]||0) + 1;
    if (o.ok){
      solved[p.id] = true;
      render(); celebrate(); speak(fill(p.yes));
    } else {
      (wrongPicked[p.id] = wrongPicked[p.id] || []).push(i);
      render(); speak('다시 생각해 볼까요? ' + fill(p.hint));
    }
  }));
}
render();
</script>
</body>
</html>
