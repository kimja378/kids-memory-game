<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 아이 동화 도서관</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf5ff;color:#233b55;font-family:system-ui,-apple-system,sans-serif}main{max-width:1150px;margin:auto;padding:18px}h1{font-size:clamp(25px,4vw,38px)}.panel{background:white;border-radius:24px;padding:20px;box-shadow:0 6px 22px #33557715}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.picture{height:min(48vw,420px);min-height:260px;background:linear-gradient(#b9e9ff 0 65%,#a4db8b 65%);border-radius:22px;display:flex;justify-content:space-evenly;align-items:center;overflow:hidden}.character{font-size:clamp(80px,13vw,155px)}.thing{font-size:clamp(95px,17vw,205px)}.question{font-size:clamp(23px,3vw,33px);font-weight:800}.choice{display:block;width:100%;border:3px solid #b8d8f5;background:#f1f8ff;padding:18px;margin:10px 0;border-radius:18px;text-align:left;font-size:clamp(19px,2.4vw,27px);font-weight:700;color:#223b55}.choice:active{transform:scale(.98)}.correct{background:#d7f9dc;border-color:#49bb69}.wrong{background:#ffe7df;border-color:#e9917a}.next,.book{border:0;border-radius:18px;background:#3279df;color:white;padding:16px 22px;font-size:21px;font-weight:800;cursor:pointer}.next:disabled{opacity:.4}.story{font-size:clamp(19px,2.3vw,26px);font-weight:700;margin:18px 0}.feedback{font-size:26px;font-weight:900;color:#13944b;min-height:40px}.muted{color:#62788c}.book{display:flex;align-items:center;gap:16px;width:100%;background:#f4f9ff;color:#234365;text-align:left;border:3px solid #bcdcf6}.book span{font-size:70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{border:0;background:none;color:#2860a3;font-size:18px;font-weight:700}.hide{display:none}@media(max-width:720px){.layout{grid-template-columns:1fr}.picture{height:280px}.panel{padding:15px}}</style></head><body><main><section id="library"><h1>📚 우리 아이 동화 도서관</h1><p class="muted">그림을 누르면 이야기가 시작돼요.</p><div class="panel"><button class="book" id="start"><span>🚌</span><div><strong>버스를 타고 친구를 만나요!</strong><p>5장면 · 그림 보고 질문에 답하기</p></div></button></div></section><section id="reader" class="hide"><div class="top"><button class="back" id="back">← 동화 도서관</button><strong id="count"></strong></div><h1>🚌 버스를 타고 친구를 만나요!</h1><div class="layout"><div class="panel"><div class="picture"><span class="character" id="person">👦🏻</span><span class="thing" id="thing">🚌</span></div><p class="story" id="story"></p></div><div class="panel"><div class="question" id="question"></div><div id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" disabled>다음 이야기 ➜</button></div></div></section></main><script>const scenes=[{thing:"🚌",text:"정류장에서 버스를 기다려요. 파란 버스가 왔어요!",q:"무엇이 왔을까요?",a:["🚌 버스","🚂 기차","✈️ 비행기"],ok:0},{thing:"🚪",text:"버스 문이 열렸어요. 천천히 버스에 올라타요.",q:"버스에 탈 때 어떻게 할까요?",a:["🏃 뛰어요","✋ 손잡이를 잡아요","🦘 점프해요"],ok:1},{thing:"💺",text:"버스 안에서는 자리에 안전하게 앉아요.",q:"버스 안에서는 어떻게 할까요?",a:["🪑 앉아요","🏃 뛰어요","🦘 뛰어올라요"],ok:0},{thing:"🐰",text:"버스에서 내려 토끼 친구를 만났어요!",q:"누구를 만났을까요?",a:["🐶 강아지","🐰 토끼","🐻 곰"],ok:1},{thing:"⚽🐰",text:"토끼 친구와 인사하고 공놀이를 해요.",q:"친구를 만나면 뭐라고 할까요?",a:["👋 안녕!","😠 저리 가!","🤫 아무 말도 안 해요"],ok:0}];let index=0,solved=false;const el=id=>document.getElementById(id);function render(){solved=false;let s=scenes[index];el("count").textContent=(index+1)+" / "+scenes.length;el("thing").textContent=s.thing;el("story").textContent=s.text;el("question").textContent="❓ "+s.q;el("feedback").textContent="";el("next").disabled=true;el("next").textContent=index===4?"처음부터 다시 보기 ↻":"다음 이야기 ➜";el("choices").replaceChildren(...s.a.map((label,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=label;b.onclick=()=>{if(solved)return;if(i===s.ok){solved=true;b.classList.add("correct");el("feedback").textContent="🌟 잘했어! 최고야!";el("next").disabled=false}else{b.classList.add("wrong");el("feedback").textContent="💛 다시 한번 해보자!"}};return b}))}el("start").onclick=()=>{el("library").classList.add("hide");el("reader").classList.remove("hide");index=0;render()};el("back").onclick=()=>{el("reader").classList.add("hide");el("library").classList.remove("hide")};el("next").onclick=()=>{index=(index+1)%scenes.length;render()};</script></body></html>
