<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>필요한 물건을 찾아요</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-speak" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="#ffd36b" stroke="#e0a73a"/></symbol>
</svg>

<section id="start">
  <h1>필요한 물건을 찾아요</h1>
  <p>그림 속 상황을 보고, 필요한 물건을 골라 보세요.</p>
  <div class="levels" id="levels"></div>
  <button class="go" id="go">시작하기</button>
  <button class="parentbtn" id="openReport1"><svg class="ic"><use href="#i-chart"/></svg> 부모님 기록</button>
</section>

<section id="game" class="hidden">
  <div class="top">
    <button class="iconbtn" id="home" aria-label="처음으로"><svg class="ic"><use href="#i-home"/></svg></button>
    <div class="round" id="round"></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="openReport2" aria-label="부모님 기록"><svg class="ic"><use href="#i-chart"/></svg></button>
  </div>
  <div class="main">
    <div class="panel left">
      <div class="scene" id="scene"><img id="sceneImg" alt=""></div>
      <div class="story">
        <div class="txt"><span class="ttl" id="title"></span><span id="storyText"></span></div>
        <button class="speak" id="speak" aria-label="다시 듣기"><svg class="ic"><use href="#i-speak"/></svg></button>
      </div>
    </div>
    <div class="panel right">
      <div class="question" id="question"></div>
      <div class="cards" id="cards"></div>
    </div>
  </div>
  <div class="bottom">
    <button class="iconbtn hint" id="hint"><svg class="ic"><use href="#i-bulb"/></svg><span>도와줘요</span></button>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <button class="next hidden" id="next">다음 <svg class="ic"><use href="#i-next"/></svg></button>
  </div>
</section>

<section id="done" class="hidden">
  <div class="stars"><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg></div>
  <h2>모두 찾았어요! 정말 잘했어요!</h2>
  <button class="go" id="again">한 번 더 하기</button>
  <button class="iconbtn" id="home2"><svg class="ic"><use href="#i-home"/></svg><span>처음으로</span></button>
</section>

<div id="report" class="hidden">
  <div class="box">
    <h2>부모님 학습 기록</h2>
    <p class="note">이 기기(아이패드)에만 저장됩니다. 아이 화면에는 점수를 보여 주지 않아요.</p>
    <div id="reportBody"></div>
    <div class="row">
      <button id="toggleNames">물건 이름 숨기기</button>
      <button id="clearLog">기록 지우기</button>
      <button id="closeReport"><b>닫기</b></button>
    </div>
  </div>
</div>

<script src="data.js?v=1"></script>
<script src="game.js?v=1"></script>
</body>
</html>
