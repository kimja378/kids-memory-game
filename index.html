<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사진 기억놀이</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7ff;color:#27334a;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{max-width:1160px;margin:auto;padding:14px}h1{text-align:center;font-size:clamp(26px,4vw,42px);margin:10px}.subtitle{text-align:center;color:#65738a;font-size:18px}.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:20px 0}button,select{border:2px solid #cbd5ef;border-radius:14px;background:white;color:#26354d;font:700 17px system-ui;padding:12px 15px;cursor:pointer}.primary{background:#526fe5;color:white;border-color:#526fe5}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,20px)}.card{aspect-ratio:.74;min-height:175px;padding:0;border:0;background:transparent;perspective:1000px;touch-action:manipulation}.inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .65s ease}.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:3px solid #d5def2;border-radius:22px;background:white;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;box-shadow:0 8px 20px #27395914}.back{transform:rotateY(180deg);background:linear-gradient(135deg,#dce6ff,#f0e8ff);border-color:#b4c2ef}.face img{width:95%;height:82%;object-fit:contain}.number{position:absolute;top:9px;left:12px;font-size:16px;font-weight:800;color:#64718a}.name{font-size:clamp(17px,2.8vw,28px);font-weight:800}.question{font-size:clamp(85px,15vw,165px);font-weight:900;color:#768bda}#status{text-align:center;min-height:35px;margin:20px;font-size:clamp(19px,3vw,27px);font-weight:800}.note{text-align:center;color:#67758c;font-size:15px}body.noNames .name{visibility:hidden}@media(max-width:600px){main{padding:9px}.tools button,.tools select{font-size:14px;padding:10px}.face{border-radius:13px;border-width:2px}.number{font-size:12px;top:7px;left:7px}.name{font-size:16px}}
</style></head><body class="noNames"><main><h1>📷 사진 기억놀이</h1><p class="subtitle">사진 세 개를 보고 기억해요!</p><div class="tools"><select id="category"><option value="fruit">🍎 과일</option><option value="veg">🥕 채소·식재료</option><option value="animal">🐘 동물</option><option value="all">🎲 모두 섞기</option></select><button id="new">🔄 다음 문제</button><button id="hide" class="primary">🙈 모두 뒤집기</button><button id="show">👀 모두 보기</button><button id="names">이름 보기</button></div><div class="cards" id="cards"><button class="card" type="button"><span class="inner"><span class="face"><span class="number">1번</span><img src="photo_01.jpg" alt="복숭아"><span class="name">복숭아</span></span><span class="face back"><span class="number">1번</span><span class="question">?</span></span></span></button><button class="card" type="button"><span class="inner"><span class="face"><span class="number">2번</span><img src="photo_02.jpg" alt="바나나"><span class="name">바나나</span></span><span class="face back"><span class="number">2번</span><span class="question">?</span></span></span></button><button class="card" type="button"><span class="inner"><span class="face"><span class="number">3번</span><img src="photo_03.jpg" alt="사과"><span class="name">사과</span></span><span class="face back"><span class="number">3번</span><span class="question">?</span></span></span></button></div><p id="status">사진을 천천히 살펴보세요.</p><p class="note">카드를 눌러 하나씩 뒤집거나, 모두 뒤집기로 기억놀이를 시작하세요.</p></main><script>
const animals=[{"name":"강아지","tag":"dog","src":"https://images.unsplash.com/photo-1552053831-71594a27632d?w=650&fit=crop&auto=format","group":"animal"},{"name":"고양이","tag":"cat","src":"https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=650&fit=crop&auto=format","group":"animal"},{"name":"토끼","tag":"rabbit","src":"https://images.unsplash.com/photo-1585110396000-c9ffd4e4b308?w=650&fit=crop&auto=format","group":"animal"},{"name":"사자","tag":"lion","src":"https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=650&fit=crop&auto=format","group":"animal"},{"name":"코끼리","tag":"elephant","src":"https://images.unsplash.com/photo-1564760055775-d63b17a55c44?w=650&fit=crop&auto=format","group":"animal"},{"name":"기린","tag":"giraffe","src":"https://images.unsplash.com/photo-1547721064-da6cfb341d50?w=650&fit=crop&auto=format","group":"animal"},{"name":"호랑이","tag":"tiger","src":"https://images.unsplash.com/photo-1561731216-c3a4d99437d5?w=650&fit=crop&auto=format","group":"animal"},{"name":"얼룩말","tag":"zebra","src":"https://images.unsplash.com/photo-1526095179574-86e545346ae6?w=650&fit=crop&auto=format","group":"animal"}];let requestId=0;const items=[{"name":"복숭아","src":"photo_01.jpg","group":"fruit"},{"name":"바나나","src":"photo_02.jpg","group":"fruit"},{"name":"사과","src":"photo_03.jpg","group":"fruit"},{"name":"오렌지","src":"photo_04.jpg","group":"fruit"},{"name":"딸기","src":"photo_05.jpg","group":"fruit"},{"name":"배","src":"photo_06.jpg","group":"fruit"},{"name":"피망","src":"photo_07.jpg","group":"veg"},{"name":"레몬","src":"photo_08.jpg","group":"fruit"},{"name":"당근","src":"photo_09.jpg","group":"veg"},{"name":"옥수수","src":"photo_10.jpg","group":"veg"},{"name":"토마토","src":"photo_11.jpg","group":"veg"},{"name":"오이","src":"photo_12.jpg","group":"veg"},{"name":"양파","src":"photo_13.jpg","group":"veg"},{"name":"감자","src":"photo_14.jpg","group":"veg"},{"name":"토마토 단면","src":"photo_15.jpg","group":"veg"},{"name":"상추","src":"photo_16.jpg","group":"veg"},{"name":"파프리카","src":"photo_17.jpg","group":"veg"},{"name":"당근 한 개","src":"photo_18.jpg","group":"veg"},{"name":"브로콜리","src":"photo_19.jpg","group":"veg"},{"name":"감자 여러 개","src":"photo_20.jpg","group":"veg"}];const cards=Array.from(document.querySelectorAll('.card'));const status=document.getElementById('status');function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function next(){++requestId;const group=document.getElementById('category').value;const pool=[...items,...animals].filter(x=>group==='all'||x.group===group);const picked=shuffle(pool).slice(0,3);picked.forEach((item,i)=>{cards[i].classList.remove('flipped');const img=cards[i].querySelector('img');img.onerror=()=>{if(item.group==='animal'&&!img.dataset.fallback){img.dataset.fallback='1';img.src='https://loremflickr.com/640/640/'+item.tag}};img.dataset.fallback='';img.src=item.src;img.alt=item.name;cards[i].querySelector('.name').textContent=item.name});status.textContent='사진을 천천히 살펴보세요.'}function allFlip(v){cards.forEach(c=>c.classList.toggle('flipped',v));status.textContent=v?'어디에 어떤 사진이 있었을까요?':'잘했어! 최고야! ⭐'}cards.forEach(c=>c.addEventListener('click',()=>{c.classList.toggle('flipped');status.textContent=c.classList.contains('flipped')?'무엇이 숨어 있을까요?':'잘했어! 최고야! ⭐'}));document.getElementById('new').onclick=next;document.getElementById('hide').onclick=()=>allFlip(true);document.getElementById('show').onclick=()=>allFlip(false);document.getElementById('category').onchange=next;document.getElementById('names').onclick=function(){document.body.classList.toggle('noNames');this.textContent=document.body.classList.contains('noNames')?'이름 보기':'이름 숨기기'};next();
</script></body></html>
