<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사진 기억놀이</title><style>body{font-family:system-ui;background:#f5f7ff;text-align:center;color:#26354d;margin:0;padding:15px}h1{font-size:32px}nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px}button{padding:12px 15px;border:1px solid #b6c4e5;border-radius:12px;background:white;font-size:17px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:1100px;margin:auto}.card{aspect-ratio:.76;perspective:900px;border:0;background:transparent;padding:0}.inner{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s}.card.flip .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:white;border:3px solid #d3def7;border-radius:18px;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}.back{transform:rotateY(180deg);background:#dce6ff;font-size:100px;color:#7088d9}.face img{width:96%;height:83%;object-fit:contain}.name{font-size:23px;font-weight:bold}#msg{font-size:23px;font-weight:bold;margin:20px} @media(max-width:600px){.name{font-size:15px}.back{font-size:55px}}</style></head><body><h1>📷 사진 기억놀이</h1><p>사진 세 개를 보고 기억해요!</p><nav><button onclick="next()">🔄 다음 문제</button><button onclick="allFlip(true)">🙈 모두 뒤집기</button><button onclick="allFlip(false)">👀 모두 보기</button></nav><div class="cards" id="cards"><button class="card" onclick="flip(this)"><span class="inner"><span class="face"><img id="img0" alt="사과"><span class="name" id="name0">사과</span></span><span class="face back">?</span></span></button><button class="card" onclick="flip(this)"><span class="inner"><span class="face"><img id="img1" alt="바나나"><span class="name" id="name1">바나나</span></span><span class="face back">?</span></span></button><button class="card" onclick="flip(this)"><span class="inner"><span class="face"><img id="img2" alt="딸기"><span class="name" id="name2">딸기</span></span><span class="face back">?</span></span></button></div><p id="msg">사진을 천천히 살펴보세요.</p><script>const fruits=[['사과','https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=600'],['바나나','https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=600'],['딸기','https://images.unsplash.com/photo-1464965911861-746a04b4bca6?w=600'],['오렌지','https://images.unsplash.com/photo-1547514701-42782101795e?w=600'],['레몬','https://images.unsplash.com/photo-1590502593747-42a996133562?w=600'],['파인애플','https://images.unsplash.com/photo-1550258987-190a2d41a8ba?w=600'],['포도','https://images.unsplash.com/photo-1537640538966-79f369143f8f?w=600']];function flip(el){el.classList.toggle('flip');document.getElementById('msg').textContent='잘했어! 최고야! ⭐'}function allFlip(v){document.querySelectorAll('.card').forEach(c=>c.classList.toggle('flip',v));document.getElementById('msg').textContent=v?'어디에 무엇이 있었을까요?':'잘했어! 최고야! ⭐'}function next(){const a=[...fruits].sort(()=>Math.random()-.5).slice(0,3);a.forEach((x,i)=>{document.getElementById('img'+i).src=x[1];document.getElementById('img'+i).alt=x[0];document.getElementById('name'+i).textContent=x[0]});allFlip(false);document.getElementById('msg').textContent='사진을 살펴보세요.'}next();</script></body></html>
