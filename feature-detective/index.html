<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>특징 탐정 놀이 v5</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6ff;color:#293650;font-family:system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:14px}h1{text-align:center;font-size:clamp(26px,4vw,38px)}p{text-align:center;color:#69758b}.tabs,.controls{display:flex;justify-content:center;gap:12px;margin:18px 0;flex-wrap:wrap}button{cursor:pointer;font:750 clamp(16px,2.5vw,22px) system-ui;border:2px solid #cbd4ee;border-radius:18px;background:white;color:#263654;padding:13px 16px}button.active,.primary{background:#5573e9;color:white;border-color:#5573e9}.panel{background:white;border:2px solid #e1e6f7;border-radius:24px;padding:20px;box-shadow:0 10px 30px #1c2c6510}.prompt{text-align:center;font-size:clamp(22px,3vw,30px);font-weight:800;margin:12px 0}.picture{text-align:center;font-size:clamp(110px,22vw,210px);line-height:1.5}.choices,.quiz-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.choice{min-height:100px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:8px}.visual{font-size:clamp(38px,6vw,65px)}.word{font-size:clamp(14px,2vw,21px);display:block}.correct{border-color:#35a06b!important;background:#eafff1!important}.wrong{border-color:#e58b8b!important;background:#fff2f2!important}.feedback{font-size:clamp(20px,3vw,28px);font-weight:850;min-height:45px;text-align:center;color:#257b50}.hidden{display:none!important}.riddle{background:#f1f5ff;border-radius:18px;padding:20px;text-align:center;font-weight:800;font-size:clamp(19px,3vw,27px);line-height:1.65;margin:18px 0}.riddle small{display:block;font-size:14px;font-weight:500;color:#69758b;margin-top:12px}.cover{text-align:center;background:#fff4d8;border-radius:18px;padding:25px;font-size:22px;font-weight:800}.cover button{display:block;margin:18px auto 0}.quiz-grid button{padding:10px 3px}.quiz-grid .object{font-size:clamp(50px,10vw,95px)}.hint{font-size:16px}.pill{display:inline-block;border-radius:20px;background:#eef1ff;padding:8px 14px;color:#4c60aa;font-weight:800}@media(max-width:540px){main{padding:9px}.panel{padding:10px}.choices,.quiz-grid{gap:6px}.tabs button{flex:1;padding:12px 5px}.choice{min-height:85px;padding:5px}}</style></head><body><main><h1>🕵️ 특징 탐정 놀이</h1><p>종류와 색깔을 찾고, 다양한 단서로 수수께끼를 풀어요!</p><div class="tabs"><button id="foodSection" class="active">🍎 과일·채소</button><button id="objectSection">🏠 생활 물건</button></div><div class="tabs"><button id="feature" class="active">🔎 특징 찾기</button><button id="riddle">❓ 수수께끼</button></div><div class="panel"><div id="game"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><button class="primary" id="next">🔄 다음 문제</button><button id="reset">↩️ 다시 하기</button></div></div><p>부모님이 질문을 읽어 주세요. 소리와 마이크는 사용하지 않습니다.</p></main><script>

 ];const objects=[

["가방","🎒","현관","물건 담아 메기","책이나 준비물을 넣고 다닐 때 사용해.","어깨에 메거나 손으로 들 수 있어."],
["세탁기","🧺","세탁실","옷 빨기","더러워진 옷을 깨끗하게 해 주는 기계야.","물과 세제를 넣고 버튼을 누르면 안에서 빙글빙글 돌아."],
["머리빗","🪮","욕실","머리 빗기","머리카락이 엉켰을 때 사용해.","가느다란 빗살이 여러 개 나란히 있어."],

["접시","🍽️","주방","음식 담기","밥을 먹을 때 식탁 위에 놓아.","음식을 올려놓는 넓고 납작한 그릇이야."],

];let section='food';let mode='feature',index=0,step=0,done=false;const $=x=>document.getElementById(x);const cats=[['과일','🌳'],['채소','🌱'],['동물','🐾']];const colors=[['빨간색','#ed4d4d'],['주황색','#f89b28'],['노란색','#f1ce38'],['초록색','#3dbb68'],['보라색','#9659bf']];function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function art(x){return '<span class="object">'+x[1]+'</span>'}function current(){return section==='food'?data:objects}function render(){const x=current()[index];$('foodSection').classList.toggle('active',section==='food');$('objectSection').classList.toggle('active',section==='object');$('feature').classList.toggle('active',mode==='feature');$('riddle').classList.toggle('active',mode==='riddle');$('feedback').textContent='';if(mode==='feature'){const cat=step===0;const obj=section==='object';const locations=['욕실','책상','현관','세탁실','옷장','주방','침실','거실'];const purposes=[...new Set(objects.map(y=>y[3]))];const opts=obj?(cat?locations.map(y=>[y,'🏠']):purposes.map(y=>[y,'✨'])):(cat?cats:colors);const answer=cat?x[2]:x[3];const choices=shuffle([opts.find(y=>y[0]===answer),...shuffle(opts.filter(y=>y[0]!==answer)).slice(0,2)]);$('game').innerHTML='<div class="prompt">'+x[0]+'는 '+(obj?(cat?'주로 어디에서 볼까?':'무엇을 할 때 사용할까?'):(cat?'어떤 종류일까?':'무슨 색깔일까?'))+'</div><div class="picture">'+x[1]+'</div><p><span class="pill">'+(step+1)+' / 2</span></p><div class="choices">'+choices.map(y=>'<button class="choice" data-answer="'+y[0]+'"><span class="visual" '+(cat?'':'style="color:'+y[1]+'"')+'>'+(obj?(cat?'🏠':'✨'):(cat?y[1]:'●'))+'</span><span class="word">'+y[0]+'</span></button>').join('')+'</div><p class="hint">종류와 색깔을 먼저 연습해요. 애매한 모양 문제는 뺐어요.</p>'}else{const opts=shuffle([x,...shuffle(current().filter(y=>y!==x&&(section==='object'?y[3]!==x[3]:y[2]===x[2]))).slice(0,2)]);$('game').innerHTML='<div class="prompt">누구일까? 무엇일까?</div><div class="riddle">'+x[4]+'<div>'+x[5]+'</div><small>부모님이 단서를 읽어 주세요</small></div><div id="answers" class="quiz-grid hidden">'+opts.map(y=>'<button data-answer="'+y[0]+'">'+art(y)+'<span class="word">'+y[0]+'</span></button>').join('')+'</div><div id="cover" class="cover">🧠 그림 없이 먼저 생각하고 말해 보세요!<button id="showHint">👀 그림 단서 보기</button></div><p id="hideHint" class="hidden"><button>🙈 그림 다시 가리기</button></p>';$('showHint').onclick=toggleHint;$('hideHint').onclick=toggleHint}document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>pick(b))}
function toggleHint(){$('answers').classList.toggle('hidden');$('cover').classList.toggle('hidden');$('hideHint').classList.toggle('hidden')}function pick(b){if(done)return;const x=current()[index];const correct=mode==='riddle'?x[0]:step===0?x[2]:x[3];document.querySelectorAll('[data-answer]').forEach(y=>y.classList.remove('wrong'));if(b.dataset.answer!==correct){b.classList.add('wrong');$('feedback').textContent='다시 생각해 보자! 💛';return}b.classList.add('correct');$('feedback').textContent='잘했어! 최고야! ⭐';done=true;if(mode==='feature'&&step===0)setTimeout(()=>{step=1;done=false;render()},1050)}function next(){index=(index+1)%current().length;step=0;done=false;render()}function reset(){index=0;step=0;done=false;render()}$('foodSection').onclick=()=>{section='food';reset()};$('objectSection').onclick=()=>{section='object';reset()};$('feature').onclick=()=>{mode='feature';reset()};$('riddle').onclick=()=>{mode='riddle';reset()};$('next').onclick=next;$('reset').onclick=reset;render();</script></body></html>
