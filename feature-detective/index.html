rid button{padding:10px 3px}.quiz-grid .object{font-size:clamp(50px,10vw,95px)}.hint{font-size:16px}.pill{display:inline-block;border-radius:20px;background:#eef1ff;padding:8px 14px;color:#4c60aa;font-weight:800}@media(max-width:540px){main{padding:9px}.panel{padding:10px}.choices,.quiz-grid{gap:6px}.tabs button{flex:1;padding:12px 5px}.choice{min-height:85px;padding:5px}} .object-photo{display:block;width:min(75%,330px);height:240px;object-fit:contain;margin:auto}.quiz-grid .object-photo{width:100%;height:95px;object-fit:contain}</style></head><body><main><h1>🕵️ 특징 탐정 놀이</h1><p>종류와 색깔을 찾고, 다양한 단서로 수수께끼를 풀어요!</p><div class="tabs"><button id="foodSection" class="active">🍎 과일·채소</button><button id="objectSection">🏠 생활 물건</button></div><div class="tabs"><button id="feature" class="active">🔎 특징 찾기</button><button id="riddle">❓ 수수께끼</button></div><div class="panel"><div id="game"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><button class="primary" id="next">🔄 다음 문제</button><button id="reset">↩️ 다시 하기</button></div></div><p>부모님이 질문을 읽어 주세요. 소리와 마이크는 사용하지 않습니다.</p></main><script>

];let section='food';let mode='feature',index=0,step=0,done=false;const $=x=>document.getElementById(x);const cats=[['과일','🌳'],['채소','🌱'],['동물','🐾']];const colors=[['빨간색','#ed4d4d'],['주황색','#f89b28'],['노란색','#f1ce38'],['초록색','#3dbb68'],['보라색','#9659bf']];function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function art(x){return x[1].endsWith('.jpg')?'<img class="object-photo" src="'+x[1]+'" alt="'+x[0]+'" onerror="this.replaceWith(document.createTextNode(\''+(x[6]||'❓')+'\'))">':'<span class="object">'+x[1]+'</span>'}function josa(w){const c=w.charCodeAt(w.length-1)-44032;return c>=0&&c<11172&&c%28?'은':'는'}function current(){return section==='food'?data:objects}function render(){const x=current()[index];$('foodSection').classList.toggle('active',section==='food');$('objectSection').classList.toggle('active',section==='object');$('feature').classList.toggle('active',mode==='feature');$('riddle').classList.toggle('active',mode==='riddle');$('feedback').textContent='';if(mode==='feature'){const cat=step===0;const obj=section==='object';const locations=['욕실','책상','현관','세탁실','옷장','주방','침실','거실'];const purposes=[...new Set(objects.map(y=>y[3]))];const opts=obj?(cat?locations.map(y=>[y,'🏠']):purposes.map(y=>[y,'✨'])):(cat?cats:colors);const answer=cat?x[2]:x[3];const choices=shuffle([opts.find(y=>y[0]===answer),...shuffle(opts.filter(y=>y[0]!==answer)).slice(0,2)]);$('game').innerHTML='<div class="prompt">'+x[0]+josa(x[0])+' '+(obj?(cat?'주로 어디에서 볼까?':'무엇을 할 때 사용할까?'):(cat?'어떤 종류일까?':'무슨 색깔일까?'))+'</div><div class="picture">'+x[1]+'</div><p><span class="pill">'+(step+1)+' / 2</span></p><div class="choices">'+choices.map(y=>'<button class="choice" data-answer="'+y[0]+'"><span class="visual" '+(cat?'':'style="color:'+y[1]+'"')+'>'+(obj?(cat?'🏠':'✨'):(cat?y[1]:'●'))+'</span><span class="word">'+y[0]+'</span></button>').join('')+'</div><p class="hint">종류와 색깔을 먼저 연습해요. 애매한 모양 문제는 뺐어요.</p>'}else{const opts=shuffle([x,...shuffle(current().filter(y=>y!==x&&(section==='object'?y[3]!==x[3]:y[2]===x[2]))).slice(0,2)]);$('game').innerHTML='<div class="prompt">누구일까? 무엇일까?</div><div class="riddle">'+x[4]+'<div>'+x[5]+'</div><small>부모님이 단서를 읽어 주세요</small></div><div id="answers" class="quiz-grid hidden">'+opts.map(y=>'<button data-answer="'+y[0]+'">'+art(y)+'<span class="word">'+y[0]+'</span></button>').join('')+'</div><div id="cover" class="cover">🧠 그림 없이 먼저 생각하고 말해 보세요!<button id="showHint">👀 그림 단서 보기</button></div><p id="hideHint" class="hidden"><button>🙈 그림 다시 가리기</button></p>';$('showHint').onclick=toggleHint;$('hideHint').onclick=toggleHint}document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>pick(b))}
function toggleHint(){$('answers').classList.toggle('hidden');$('cover').classList.toggle('hidden');$('hideHint').classList.toggle('hidden')}function pick(b){if(done)return;const x=current()[index];const correct=mode==='riddle'?x[0]:step===0?x[2]:x[3];document.querySelectorAll('[data-answer]').forEach(y=>y.classList.remove('wrong'));if(b.dataset.answer!==correct){b.classList.add('wrong');$('feedback').textContent='다시 생각해 보자! 💛';return}b.classList.add('correct');$('feedback').textContent='잘했어! 최고야! ⭐';done=true;if(mode==='feature'&&step===0)setTimeout(()=>{step=1;done=false;render()},1050)}function next(){index=(index+1)%current().length;step=0;done=false;render()}function reset(){index=0;step=0;done=false;render()}$('foodSection').onclick=()=>{section='food';reset()};$('objectSection').onclick=()=>{section='object';reset()};$('feature').onclick=()=>{mode='feature';reset()};$('riddle').onclick=()=>{mode='riddle';reset()};$('next').onclick=next;$('reset').onclick=reset;render();</script></body></html>
