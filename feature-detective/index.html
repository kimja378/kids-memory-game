<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>특징 탐정 놀이 v4</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6ff;color:#293650;font-family:system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:14px}h1{text-align:center;font-size:clamp(26px,4vw,38px)}p{text-align:center;color:#69758b}.tabs,.controls{display:flex;justify-content:center;gap:12px;margin:18px 0;flex-wrap:wrap}button{cursor:pointer;font:750 clamp(16px,2.5vw,22px) system-ui;border:2px solid #cbd4ee;border-radius:18px;background:white;color:#263654;padding:13px 16px}button.active,.primary{background:#5573e9;color:white;border-color:#5573e9}.panel{background:white;border:2px solid #e1e6f7;border-radius:24px;padding:20px;box-shadow:0 10px 30px #1c2c6510}.prompt{text-align:center;font-size:clamp(22px,3vw,30px);font-weight:800;margin:12px 0}.picture{text-align:center;font-size:clamp(110px,22vw,210px);line-height:1.5}.choices,.quiz-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.choice{min-height:100px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:8px}.visual{font-size:clamp(38px,6vw,65px)}.word{font-size:clamp(14px,2vw,21px);display:block}.correct{border-color:#35a06b!important;background:#eafff1!important}.wrong{border-color:#e58b8b!important;background:#fff2f2!important}.feedback{font-size:clamp(20px,3vw,28px);font-weight:850;min-height:45px;text-align:center;color:#257b50}.hidden{display:none!important}.riddle{background:#f1f5ff;border-radius:18px;padding:20px;text-align:center;font-weight:800;font-size:clamp(19px,3vw,27px);line-height:1.65;margin:18px 0}.riddle small{display:block;font-size:14px;font-weight:500;color:#69758b;margin-top:12px}.cover{text-align:center;background:#fff4d8;border-radius:18px;padding:25px;font-size:22px;font-weight:800}.cover button{display:block;margin:18px auto 0}.quiz-grid button{padding:10px 3px}.quiz-grid .object{font-size:clamp(50px,10vw,95px)}.hint{font-size:16px}.pill{display:inline-block;border-radius:20px;background:#eef1ff;padding:8px 14px;color:#4c60aa;font-weight:800}@media(max-width:540px){main{padding:9px}.panel{padding:10px}.choices,.quiz-grid{gap:6px}.tabs button{flex:1;padding:12px 5px}.choice{min-height:85px;padding:5px}}</style></head><body><main><h1>🕵️ 특징 탐정 놀이</h1><p>종류와 색깔을 찾고, 다양한 단서로 수수께끼를 풀어요!</p><div class="tabs"><button id="feature" class="active">🔎 특징 찾기</button><button id="riddle">❓ 수수께끼</button></div><div class="panel"><div id="game"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><button class="primary" id="next">🔄 다음 문제</button><button id="reset">↩️ 다시 하기</button></div></div><p>부모님이 질문을 읽어 주세요. 소리와 마이크는 사용하지 않습니다.</p></main><script>
const data=[
['토마토','🍅','채소','빨간색','빨갛고 동그란 채소야.','샐러드에도 넣고 케첩을 만들 때도 써.'],
['당근','🥕','채소','주황색','주황색이고 땅속에서 자라는 채소야.','아삭아삭하고 토끼가 먹는 것으로 유명해.'],
['오이','🥒','채소','초록색','초록색이고 길쭉한 채소야.','먹으면 아삭아삭하고 물이 많아.'],
['가지','🍆','채소','보라색','보라색 껍질을 가진 채소야.','익혀 먹으면 부드럽고 말랑말랑해.'],
['파프리카','🫑','채소','초록색','속이 비어 있고 씨가 들어 있는 채소야.','아삭아삭하고 빨강, 노랑, 초록 등 여러 색이 있어.'],
['사과','🍎','과일','빨간색','빨간색인 경우가 많은 동그란 과일이야.','아삭아삭하고 달콤해. 나무에서 자라는 열매야.'],
['바나나','🍌','과일','노란색','노란 껍질을 벗겨 먹는 과일이야.','길고 휘어 있고 속은 부드럽고 달콤해.'],
['오렌지','🍊','과일','주황색','주황색 껍질이 있는 과일이야.','껍질을 벗기면 여러 조각이 있고 새콤달콤해.'],
['딸기','🍓','과일','빨간색','빨갛고 겉에 작은 씨처럼 보이는 점들이 있어.','꼭지가 초록색이고 달콤한 과일이야.'],
['포도','🍇','과일','보라색','작고 둥근 알들이 여러 개 모여 있어.','한 알씩 떼어 먹는 달콤한 과일이야.'],
['레몬','🍋','과일','노란색','노란색 껍질을 가진 과일이야.','먹으면 아주 시고 레모네이드를 만들기도 해.'],
['수박','🍉','과일','초록색','겉은 초록색 줄무늬가 있고 아주 큰 과일이야.','잘라 보면 속이 빨갛고 물이 많아.']
];let mode='feature',index=0,step=0,done=false;const $=x=>document.getElementById(x);const cats=[['과일','🌳'],['채소','🌱'],['동물','🐾']];const colors=[['빨간색','#ed4d4d'],['주황색','#f89b28'],['노란색','#f1ce38'],['초록색','#3dbb68'],['보라색','#9659bf']];function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function art(x){return '<span class="object">'+x[1]+'</span>'}function render(){const x=data[index];$('feature').classList.toggle('active',mode==='feature');$('riddle').classList.toggle('active',mode==='riddle');$('feedback').textContent='';if(mode==='feature'){const cat=step===0;const opts=cat?cats:colors;const answer=cat?x[2]:x[3];const choices=shuffle([opts.find(y=>y[0]===answer),...shuffle(opts.filter(y=>y[0]!==answer)).slice(0,2)]);$('game').innerHTML='<div class="prompt">'+x[0]+'는 '+(cat?'어떤 종류일까?':'무슨 색깔일까?')+'</div><div class="picture">'+x[1]+'</div><p><span class="pill">'+(step+1)+' / 2</span></p><div class="choices">'+choices.map(y=>'<button class="choice" data-answer="'+y[0]+'"><span class="visual" '+(cat?'':'style="color:'+y[1]+'"')+'>'+(cat?y[1]:'●')+'</span><span class="word">'+y[0]+'</span></button>').join('')+'</div><p class="hint">종류와 색깔을 먼저 연습해요. 애매한 모양 문제는 뺐어요.</p>'}else{const opts=shuffle([x,...shuffle(data.filter(y=>y!==x&&y[2]===x[2])).slice(0,2)]);$('game').innerHTML='<div class="prompt">누구일까? 무엇일까?</div><div class="riddle">'+x[4]+'<div>'+x[5]+'</div><small>부모님이 단서를 읽어 주세요</small></div><div id="answers" class="quiz-grid hidden">'+opts.map(y=>'<button data-answer="'+y[0]+'">'+art(y)+'<span class="word">'+y[0]+'</span></button>').join('')+'</div><div id="cover" class="cover">🧠 그림 없이 먼저 생각하고 말해 보세요!<button id="showHint">👀 그림 단서 보기</button></div><p id="hideHint" class="hidden"><button>🙈 그림 다시 가리기</button></p>';$('showHint').onclick=toggleHint;$('hideHint').onclick=toggleHint}document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>pick(b))}
function toggleHint(){$('answers').classList.toggle('hidden');$('cover').classList.toggle('hidden');$('hideHint').classList.toggle('hidden')}function pick(b){if(done)return;const x=data[index];const correct=mode==='riddle'?x[0]:step===0?x[2]:x[3];document.querySelectorAll('[data-answer]').forEach(y=>y.classList.remove('wrong'));if(b.dataset.answer!==correct){b.classList.add('wrong');$('feedback').textContent='다시 생각해 보자! 💛';return}b.classList.add('correct');$('feedback').textContent='잘했어! 최고야! ⭐';done=true;if(mode==='feature'&&step===0)setTimeout(()=>{step=1;done=false;render()},1050)}function next(){index=(index+1)%data.length;step=0;done=false;render()}function reset(){index=0;step=0;done=false;render()}$('feature').onclick=()=>{mode='feature';reset()};$('riddle').onclick=()=>{mode='riddle';reset()};$('next').onclick=next;$('reset').onclick=reset;render();</script></body></html>
