<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동물 친구 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  /* 탐험 지도(동물 카드) → 동물 만나기 → 질문 3개 → 스티커. 사파리 탐험 느낌의 흙색·초록 */
  --bg:#f1ecd9;
  --paper:#fffdf6;
  --ink:#2f3a2b;
  --muted:#6a705e;
  --leaf:#4f8f4a;
  --accent:#2f7fc1;
  --sun:#ffc63d;
  --good:#2e9e62;
  --line:#ddd5bb;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 40px}
button{font:inherit;color:inherit}
.btn{font-family:var(--display);font-size:clamp(18px,3.8vw,22px);border:none;border-radius:999px;padding:12px 22px;cursor:pointer;background:#e9e3cc;color:var(--ink)}
.btn:focus-visible,.card:focus-visible,.opt:focus-visible,.fact:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.btn-next{background:var(--accent);color:#fff;min-width:130px}
.btn-next:disabled{background:#cfd6d2;color:#738078;cursor:not-allowed}
.btn-sun{background:var(--sun);color:#3d2c00}
.pulse{animation:pulse 1.2s ease-in-out infinite}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:19px;background:#fff;border-radius:999px;padding:8px 16px;text-decoration:none;color:var(--ink);box-shadow:0 3px 0 var(--line);border:none;cursor:pointer}
.steps{display:flex;gap:6px;align-items:center}
.step{font-family:var(--display);font-size:14px;padding:4px 10px;border-radius:999px;background:#e9e3cc;color:var(--muted)}
.step.now{background:var(--sun);color:#3d2c00}
.step.done{background:#d5ecd8;color:#1b6640}
.panel{background:var(--paper);border-radius:26px;box-shadow:0 8px 26px rgba(70,60,20,.13);overflow:hidden}
.pad{padding:18px 22px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,40px);margin:0;text-wrap:balance}
.say{font-family:var(--display);font-size:clamp(22px,4.8vw,30px);line-height:1.5;margin:0;word-break:keep-all}
.small{font-size:16px;color:var(--muted);line-height:1.6}

/* 지도 */
.hero{display:flex;align-items:center;gap:16px;padding:18px 22px}
.avatar{width:96px;height:96px;flex:none}
.count{font-family:var(--display);font-size:20px;color:#7a5a00;background:#fff3c4;border-radius:999px;padding:4px 14px;display:inline-block;margin-top:6px}
.zone{font-family:var(--display);font-weight:400;font-size:clamp(20px,4vw,26px);margin:8px 20px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:4px 18px 20px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border:4px solid var(--line);border-radius:24px;padding:12px 8px 14px;cursor:pointer;transition:transform .12s}
.card:active{transform:scale(.97)}
.card img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.card .nm{font-family:var(--display);font-size:22px}
.card.got{border-color:#f2c94c;background:#fffaea}
.badge{position:absolute;top:6px;right:8px;font-size:30px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}

/* 만나기 */
.photo{position:relative;background:#e8efe0}
.photo img{display:block;width:100%;max-height:52vh;object-fit:cover}
.bubble{position:absolute;left:16px;top:16px;background:#fff;border-radius:20px;padding:8px 16px;font-family:var(--display);font-size:clamp(20px,4vw,26px);box-shadow:0 3px 10px rgba(0,0,0,.15)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 18px 6px}
.fact{border:4px solid var(--line);background:#fff;border-radius:20px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--display);font-size:clamp(16px,3.6vw,21px)}
.fact .ic{font-size:clamp(34px,7vw,44px);line-height:1}
.fact.seen{border-color:var(--good);background:#eef8f0}
.factText{margin:8px 18px 0;padding:14px 18px;border-radius:18px;background:#fff6d6;font-family:var(--display);font-size:clamp(20px,4.4vw,26px);line-height:1.5;min-height:64px;word-break:keep-all}

/* 질문 */
.opts{display:grid;gap:14px;padding:6px 18px 14px}
.opts.n2{grid-template-columns:1fr 1fr}
.opts.n3{grid-template-columns:1fr 1fr 1fr}
.opt{border:4px solid var(--line);background:#fff;border-radius:22px;padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:clamp(17px,3.8vw,23px);min-height:160px;transition:transform .12s;word-break:keep-all;text-align:center}
.opt:hover{transform:translateY(-2px)}
.opt .ic{font-size:clamp(52px,11vw,72px);line-height:1}
.opt svg{width:100%;height:auto;border-radius:14px;display:block}
.opt img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px}
.opt.right{border-color:var(--good);background:#e5f6ec}
.opt.nope{opacity:.4;animation:wobble .45s;cursor:default}
.feedback{margin:0 18px 8px;padding:12px 16px;border-radius:16px;font-family:var(--display);font-size:clamp(18px,4vw,23px);line-height:1.45;word-break:keep-all}
.fb-good{background:#e5f6ec;color:#1b6640}
.fb-hint{background:#fff3cf;color:#6e4e00}
.show{position:relative;margin:4px 18px 10px;border-radius:20px;overflow:hidden}
.show svg{display:block;width:100%;height:auto}
.show img.hab,.opt img.hab{display:block;width:100%;aspect-ratio:16/11;object-fit:cover;border-radius:14px}
.show .pic{position:absolute;left:50%;top:50%;width:38%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:6px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.25);transform:translate(-50%,-50%);animation:land .7s ease-out}
.yum{position:absolute;font-family:var(--display);font-size:clamp(26px,6vw,40px);color:#c2410c;text-shadow:0 2px 0 #fff;right:10%;top:12%;animation:pop2 1.2s ease-out infinite alternate}
.foodfly{position:absolute;font-size:clamp(40px,9vw,60px);left:12%;bottom:12%;animation:fly 1s ease-in forwards}
.eat{animation:munch .35s ease-in-out 4}
.qtext{padding:18px 22px 8px}
.chip{display:inline-block;font-family:var(--display);font-size:16px;background:#fff0c2;color:#6b4c00;border-radius:999px;padding:3px 12px;margin-bottom:8px}
.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px 18px}

/* 스티커 */
.sticker{position:relative;width:min(300px,70vw);aspect-ratio:1;margin:18px auto 6px;border-radius:50%;background:radial-gradient(circle,#fff7cf 0 60%,#ffd96b 61% 100%);display:grid;place-items:center;animation:spin-in .8s ease-out}
.sticker img{width:76%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:6px solid #fff}
.sticker .st{position:absolute;bottom:-6px;right:6px;font-size:64px}
.star{position:fixed;font-size:30px;color:var(--sun);pointer-events:none;text-shadow:0 1px 0 #d99a00;animation:pop 1.4s ease-out forwards;z-index:5}

/* 부모님 */
details.parent{margin-top:18px;background:var(--paper);border-radius:20px;padding:12px 18px;box-shadow:0 4px 14px rgba(70,60,20,.08)}
details.parent summary{font-family:var(--display);font-size:20px;cursor:pointer}
.form{display:grid;gap:12px;margin:12px 0}
.field{display:grid;gap:6px;font-size:16px;color:var(--muted)}
.field input[type=text]{font-family:var(--display);font-size:22px;padding:8px 12px;border-radius:12px;border:3px solid var(--line);max-width:260px;color:var(--ink);background:#fff}
.check{display:flex;align-items:center;gap:10px;font-size:17px}
.check input{width:22px;height:22px}
.seg{display:flex;gap:8px}
.seg button{font-family:var(--display);font-size:18px;border:3px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:#e3f0fb}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted)}
.tag{font-family:var(--display);font-size:14px;border-radius:999px;padding:3px 10px;white-space:nowrap}
.t1{background:#dff3e7;color:#1b6640}.t2{background:#fff0c7;color:#6e4e00}.t3{background:#fde0d8;color:#8a3a22}.t0{background:#eee;color:#888}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes wobble{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:translateY(0) scale(.4);opacity:1}100%{transform:translateY(-110px) scale(1.2);opacity:0}}
@keyframes pop2{from{transform:scale(1) rotate(-6deg)}to{transform:scale(1.15) rotate(6deg)}}
@keyframes land{0%{transform:translate(-50%,-160%) scale(.6)}70%{transform:translate(-50%,-45%) scale(1.05)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes fly{0%{transform:translate(0,0) scale(1)}100%{transform:translate(min(28vw,240px),-110px) scale(.3);opacity:0}}
@keyframes munch{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.06,.94)}}
@keyframes spin-in{from{transform:rotate(-180deg) scale(.2)}to{transform:rotate(0) scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.opts.n3{grid-template-columns:1fr 1fr}.opt{min-height:130px}.facts{gap:8px;padding:12px}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>

const KEY = 'animalExplorer.v1';
let store = {name:'토리', stickers:{}, log:{}, autoRead:true, nOpts:2};
try{ const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) store = Object.assign(store, s); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

/* ---------- 이름 조사 ---------- */
function hasBatchim(w){ const c=w.charCodeAt(w.length-1); if(c<0xAC00||c>0xD7A3) return false; return (c-0xAC00)%28!==0; }
function nm(){ const n = store.name || '토리'; return hasBatchim(n) ? n+'이' : n; }
function voc(){ const n = store.name || '토리'; if (hasBatchim(n)) return n+'아'; if (n.length>=2 && n.endsWith('이') && hasBatchim(n.slice(0,-1))) return n.slice(0,-1)+'아'; return n+'야'; }
function josa(w, a, b){ return w + (hasBatchim(w) ? a : b); }

/* ---------- 읽어주기 (아이패드 대응) ---------- */
let koVoice = null;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let currentUtter = null, speechUnlocked = false;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().replace('_','-').startsWith('ko'));
    koVoice = vs.find(v => v.localService && v.default) || vs.find(v => v.localService) || vs[0] || null;
  }catch(e){}
}
if ('speechSynthesis' in window){ pickVoice(); try{ speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){} }
function unlockSpeech(){
  if (speechUnlocked || !('speechSynthesis' in window)) return;
  speechUnlocked = true;
  try{ const u = new SpeechSynthesisUtterance(' '); u.lang='ko-KR'; u.volume=0; speechSynthesis.speak(u); }catch(e){}
}
document.addEventListener('touchend', unlockSpeech, {passive:true});
document.addEventListener('click', unlockSpeech);
function speak(text, force){
  if (!('speechSynthesis' in window)) return;
  if (!store.autoRead && !force) return;
  try{
    const say = () => {
      const u = new SpeechSynthesisUtterance(text.replace(/["“”]/g,''));
      u.lang = 'ko-KR'; if (koVoice && !isIOS) u.voice = koVoice;
      u.rate = 0.85; u.pitch = 1.1; u.volume = 1; currentUtter = u;
      try{ speechSynthesis.resume(); }catch(e){}
      speechSynthesis.speak(u);
    };
    if (speechSynthesis.speaking || speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(say, 150); }
    else say();
  }catch(e){}
}

/* ---------- 상태 ---------- */
const app = document.getElementById('app');
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; } })();
let cur = null;      // 지금 만나는 동물
let step = 'map';    // map | meet | home | food | who | sticker
let seen = {};       // 만나기 화면에서 누른 카드
let q = null;        // 현재 질문 상태
let attempts = {};   // 이번 탐험의 질문별 시도 횟수
const STEPS = [['meet','만나요'],['home','사는 곳'],['food','먹이'],['who','누구?'],['sticker','스티커']];

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function stars(n=16){
  if (reduceMotion) return;
  for (let i=0;i<n;i++){
    const s = document.createElement('span'); s.className='star'; s.textContent='★';
    s.style.left = (10+Math.random()*80)+'vw'; s.style.top = (35+Math.random()*45)+'vh';
    s.style.animationDelay = (Math.random()*.4)+'s';
    document.body.appendChild(s); setTimeout(() => s.remove(), 2000);
  }
}
function avatarSVG(){
  return `<svg class="avatar" viewBox="-50 -62 100 112" aria-hidden="true">
    <circle cx="0" cy="0" r="44" fill="#a56b3f"/>

    <rect x="-30" y="-50" width="60" height="7" fill="#7a5a2c"/>

}
function topbar(){
  const idx = STEPS.findIndex(s => s[0] === step);
  return `<div class="topbar">
    <button class="pill" id="toMap">🗺️ 탐험 지도</button>

}

        </div>

        </button>`).join('')}
      </div>`).join('')}
    </div>
    ${parentHTML()}`;
  app.querySelectorAll('.card').forEach(b => b.addEventListener('click', () => startAnimal(b.dataset.id)));

function startAnimal(id){
  cur = byId[id]; seen = {}; attempts = {}; step = 'meet';
  render();
  speak(`안녕! 나는 ${cur.name}${hasBatchim(cur.name)?'이야':'야'}. ${cur.sound} 나를 눌러서 알아봐!`.replace('  ',' '));
}

/* ---------- 화면: 만나요 ---------- */
function renderMeet(){
  const facts = [['looks','👀','생김새',cur.looks],['home','🏠','사는 곳',cur.homeText],['food','🍽️','먹이',cur.foodText]];
  const last = facts.find(f => f[0] === seen._last);
  const all = facts.every(f => seen[f[0]]);
  app.innerHTML = `${topbar()}
    <div class="panel">
      <div class="photo"><img src="${IMG(cur.id)}" alt="${cur.name} 사진">
        <div class="bubble">${esc(cur.name)}${cur.sound ? ' · '+esc(cur.sound) : ''}</div></div>
      <div class="facts">
        ${facts.map(f => `<button class="fact ${seen[f[0]]?'seen':''}" data-k="${f[0]}"><span class="ic" aria-hidden="true">${f[1]}</span>${f[2]}</button>`).join('')}
      </div>
      <div class="factText" role="status">${last ? esc(last[3]) : `세 개를 하나씩 눌러서 ${esc(cur.name)}${hasBatchim(cur.name)?'을':'를'} 알아봐요!`}</div>
      <div class="controls">
        <button class="btn btn-sun" id="again">🔊 다시 듣기</button>
        <button class="btn btn-next ${all?'pulse':''}" id="next" ${all?'':'disabled'}>퀴즈 하러 가기 ▶</button>
      </div>
    </div>`;
  app.querySelectorAll('.fact').forEach(b => b.addEventListener('click', () => {
    const f = facts.find(x => x[0] === b.dataset.k);
    seen[f[0]] = true; seen._last = f[0];
    renderMeet(); speak(f[3], true);
  }));
  document.getElementById('again').addEventListener('click', () => speak(last ? last[3] : `${cur.name}. ${cur.sound}`, true));
  document.getElementById('next').addEventListener('click', () => goQ('home'));
  bindTop();
}

/* ---------- 질문 ---------- */
function otherAnimals(){
  const bad = new Set([cur.id, ...(cur.notWith||[])]);
  return shuffle(A.filter(a => !bad.has(a.id) && !(a.notWith||[]).includes(cur.id)));
}
function goQ(kind){
  step = kind;
  const n = store.nOpts;
  let opts;
  if (kind === 'home') opts = shuffle([{k:cur.home, ok:true}, ...cur.homeWrong.slice(0,n-1).map(k => ({k}))]);
  if (kind === 'food') opts = shuffle([{...cur.food, ok:true}, ...cur.foodWrong.slice(0,n-1)]);
  if (kind === 'who')  opts = shuffle([{id:cur.id, ok:true}, ...otherAnimals().slice(0,n-1).map(a => ({id:a.id}))]);
  q = {kind, opts, wrong:[], solved:false};
  render();
  speak(qText());
}
function qText(){
  if (q.kind === 'home') return `${cur.name}${hasBatchim(cur.name)?'은':'는'} 어디에 살까요?`;
  if (q.kind === 'food') return `${cur.name}${hasBatchim(cur.name)?'이':'가'} 배가 고파요! 무엇을 줄까요?`;
  return cur.clue;
}
function hintText(){
  if (q.kind === 'home') return `다시 생각해 볼까요? ${cur.name}${hasBatchim(cur.name)?'은':'는'} ${cur.homeText}`;
  if (q.kind === 'food') return `다시 생각해 볼까요? ${cur.name}${hasBatchim(cur.name)?'은':'는'} ${cur.foodText}`;
  return `다시 생각해 볼까요? ${cur.looks}`;
}
function yesText(){
  if (q.kind === 'home') return `맞아요! ${cur.name}${hasBatchim(cur.name)?'은':'는'} ${HOMES[cur.home].name}에 살아요.`;
  if (q.kind === 'food') return `냠냠! ${cur.name}${hasBatchim(cur.name)?'이':'가'} ${cur.food.t}${hasBatchim(cur.food.t)?'을':'를'} 맛있게 먹었어요.`;
  return `맞아요! ${cur.name}${hasBatchim(cur.name)?'이에요':'예요'}. ${cur.looks}`;
}
function optHTML(o, i){
  const cls = ['opt', q.solved && o.ok ? 'right' : '', q.wrong.includes(i) ? 'nope' : ''].join(' ');
  const dis = (q.solved || q.wrong.includes(i)) ? 'disabled' : '';
  let inner;
  if (q.kind === 'home') inner = `${habitat(o.k)}<span>${HOMES[o.k].name}</span>`;
  else if (q.kind === 'food') inner = `<span class="ic" aria-hidden="true">${o.ic}</span><span>${esc(o.t)}</span>`;
  else inner = `<img src="${IMG(o.id)}" alt="${byId[o.id].name}">`;
  return `<button class="${cls}" data-i="${i}" ${dis}>${inner}</button>`;
}
function resultHTML(){
  if (q.kind === 'home') return `<div class="show">${habitat(cur.home, 800, 550)}<img class="pic" src="${IMG(cur.id)}" alt=""></div>`;
  if (q.kind === 'food') return `<div class="show">${habitat(cur.home, 800, 550)}<img class="pic eat" src="${IMG(cur.id)}" alt=""><span class="foodfly" aria-hidden="true">${cur.food.ic}</span><span class="yum">냠냠!</span></div>`;
  return '';
}
function renderQ(){
  const chip = {home:'사는 곳 찾기', food:'먹이 주기', who:'누구일까요?'}[q.kind];
  let fb = '';
  if (q.solved) fb = `<div class="feedback fb-good" role="status">${esc(yesText())}</div>`;
  else if (q.wrong.length) fb = `<div class="feedback fb-hint" role="status">${esc(hintText())}</div>`;
  const body = q.solved && q.kind !== 'who'
    ? resultHTML()
    : `<div class="opts n${q.opts.length}">${q.opts.map(optHTML).join('')}</div>`;
  app.innerHTML = `${topbar()}
    <div class="panel">
      <div class="qtext"><span class="chip">${chip}</span><p class="say">${esc(qText())}</p></div>
      ${body}${fb}
      <div class="controls">
        <button class="btn btn-sun" id="again">🔊 다시 듣기</button>
        <button class="btn btn-next ${q.solved?'pulse':''}" id="next" ${q.solved?'':'disabled'}>다음 ▶</button>
      </div>
    </div>`;
  app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => choose(+b.dataset.i)));
  document.getElementById('again').addEventListener('click', () => speak(q.solved ? yesText() : qText(), true));
  document.getElementById('next').addEventListener('click', () => {
    if (!q.solved) return;
    if (q.kind === 'home') goQ('food');
    else if (q.kind === 'food') goQ('who');
    else giveSticker();
  });
  bindTop();
}
function choose(i){
  if (q.solved || q.wrong.includes(i)) return;
  attempts[q.kind] = (attempts[q.kind]||0) + 1;
  if (q.opts[i].ok){
    q.solved = true; renderQ(); stars(10); speak(yesText());
  } else {
    q.wrong.push(i); renderQ(); speak(hintText());
  }
}

/* ---------- 스티커 ---------- */
function giveSticker(){
  step = 'sticker';
  store.stickers[cur.id] = true;
  store.log[cur.id] = {home:attempts.home||0, food:attempts.food||0, who:attempts.who||0, at:new Date().toISOString().slice(0,10)};
  save();
  const got = A.filter(a => store.stickers[a.id]).length;
  app.innerHTML = `${topbar()}
    <div class="panel pad" style="text-align:center">
      <div class="sticker"><img src="${IMG(cur.id)}" alt="${cur.name} 스티커"><span class="st" aria-hidden="true">⭐</span></div>
      <p class="say">${esc(cur.name)} 스티커를 받았어요!</p>
      <p class="small">모은 스티커 ${got} / ${A.length}</p>
      <div class="controls" style="justify-content:center">
        <button class="btn btn-next pulse" id="next">🗺️ 다른 동물 만나러 가기</button>
      </div>
    </div>`;
  stars(22);
  speak(`우와! ${cur.name} 스티커를 받았어요! ${voc()}, 정말 멋진 탐험대장이야!`);
  document.getElementById('next').addEventListener('click', goMap);
  bindTop();
}

/* ---------- 부모님 ---------- */
function parentHTML(){
  const tag = n => n===0 ? '<span class="tag t0">-</span>' : n===1 ? '<span class="tag t1">한 번에</span>' : n===2 ? '<span class="tag t2">두 번째</span>' : `<span class="tag t3">${n}번째</span>`;
  const rows = A.filter(a => store.log[a.id]).map(a => { const l = store.log[a.id];
    return `<tr><td>${a.name}<br><span class="small">${l.at}</span></td><td>${tag(l.home)}</td><td>${tag(l.food)}</td><td>${tag(l.who)}</td></tr>`; }).join('');
  return `<details class="parent"><summary>부모님 설정 · 기록</summary>
    <div class="form">
      <label class="field" for="nameIn">아이 이름
        <input type="text" id="nameIn" maxlength="8" value="${esc(store.name)}"></label>
      <label class="check" for="readIn"><input type="checkbox" id="readIn" ${store.autoRead?'checked':''}> 화면마다 소리 내어 읽어주기</label>
      <div class="field">보기 개수
        <div class="seg"><button type="button" data-n="2" aria-pressed="${store.nOpts===2}">2개 (쉬움)</button><button type="button" data-n="3" aria-pressed="${store.nOpts===3}">3개</button></div></div>
      <div><button class="btn btn-sun" type="button" id="testBtn">🔊 소리 확인</button></div>
    </div>
    <p class="small">각 동물의 가장 최근 탐험 기록이에요. 보기가 두 개면 우연히 맞힐 수도 있으니, 맞힌 뒤 "왜 그렇게 생각했어?" 하고 물어봐 주세요. 기록과 스티커는 이 기기에만 저장돼요.</p>
    ${rows ? `<table><thead><tr><th>동물</th><th>사는 곳</th><th>먹이</th><th>누구?</th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="small">아직 기록이 없어요.</p>'}
    <p><button class="btn" type="button" id="resetBtn">스티커와 기록 지우기</button> <span class="small" id="resetMsg"></span></p>
  </details>`;
}
let resetArmed = false;
function bindParent(){
  const n = document.getElementById('nameIn');
  if (n) n.addEventListener('change', e => { store.name = e.target.value.trim() || '토리'; save(); renderMap(); });
  const r = document.getElementById('readIn');
  if (r) r.addEventListener('change', e => { store.autoRead = e.target.checked; save(); });
  app.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { store.nOpts = +b.dataset.n; save(); renderMap(); app.querySelector('details.parent').open = true; }));
  const t = document.getElementById('testBtn');
  if (t) t.addEventListener('click', () => speak('안녕! 소리가 잘 들리나요?', true));
  const rs = document.getElementById('resetBtn');
  if (rs) rs.addEventListener('click', () => {
    if (!resetArmed){ resetArmed = true; rs.textContent = '정말 지울까요? 한 번 더 누르면 지워져요'; return; }
    store.stickers = {}; store.log = {}; save(); resetArmed = false; renderMap();
  });
}

function bindTop(){ const m = document.getElementById('toMap'); if (m) m.addEventListener('click', goMap); }
function goMap(){ step = 'map'; cur = null; try{ speechSynthesis.cancel(); }catch(e){} render(); window.scrollTo({top:0}); }
function render(){
  if (step === 'map') renderMap();
  else if (step === 'meet') renderMeet();
  else if (step === 'sticker') {}
  else renderQ();
  if (step !== 'map') window.scrollTo({top:0, behavior: reduceMotion ? 'auto' : 'smooth'});
}
render();
</script>
</body>
</html>
